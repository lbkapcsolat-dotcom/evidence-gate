name: Planetary Resource Temporal Support Operator Executable Kernel

on:
  push:
    branches:
      - "feature/planetary-resource-temporal-support-operator-executable-kernel-v1"
  pull_request:

permissions:
  contents: read

jobs:
  temporal-support-operator-executable-kernel:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Enforce successor-only changes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            target_sha="${{ github.event.pull_request.head.sha }}"
          else
            target_sha="$GITHUB_SHA"
          fi
          changed="$(git diff --name-only cc0ddb1eabc19941348e7639fb5506a5863596ad..$target_sha)"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -vE '^(EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__TEMPORAL_SUPPORT_OPERATOR_EXECUTABLE_KERNEL\.json|planetary_resource_temporal_support_operator_executable_kernel_v1\.py|test_planetary_resource_temporal_support_operator_executable_kernel_v1\.py|docs/planetary_resource_temporal_support_operator_executable_kernel_v1\.md|\.github/workflows/planetary-resource-temporal-support-operator-executable-kernel\.yml)$' || true)"
          test -z "$forbidden" || { echo "Forbidden predecessor/core change:"; echo "$forbidden"; exit 1; }

      - name: Preserve reference-validator predecessor
        run: python -m unittest -v test_planetary_resource_temporal_support_operator_reference_validator_v1.py

      - name: Run focused executable-kernel test
        run: python -m unittest -v test_planetary_resource_temporal_support_operator_executable_kernel_v1.py
