          registry_sha="$(sha256sum "$ART/canonical-registry.json" | awk '{print $1}')"
          event_set_sha="$(sha256sum "$ART/pinned-event-set.jsonl" | awk '{print $1}')"
          v17_file_sha="$(sha256sum "$ART/v1_7-final-receipt.json" | awk '{print $1}')"

          jq -n \
            --arg schema "ESS_OPENSHELL_CROSS_RUN_EXPORT_MANIFEST_V1_8" \
            --arg source_run "$GITHUB_RUN_ID" \
            --arg source_sha "$GITHUB_SHA" \
            --arg pinned_v1_7_receipt "$PINNED_V1_7_RECEIPT_SHA256" \
            --arg registry_sha "$registry_sha" \
            --arg event_set_sha "$event_set_sha" \
            --arg v17_file_sha "$v17_file_sha" \
            '{
              schema:$schema,
              source_run_id:$source_run,
              source_sha:$source_sha,
              pinned_v1_7_receipt_sha256:$pinned_v1_7_receipt,
              canonical_registry_file_sha256:$registry_sha,
              pinned_event_set_file_sha256:$event_set_sha,
              v1_7_final_receipt_file_sha256:$v17_file_sha,
              exported_registry_count:4,
              synthetic_uid:false,
              strict_cross_event_claim:"HOLD_NATIVE_CORRELATION_UID_NOT_POPULATABLE_BY_V0_1_2_TYPED_METADATA_MODEL"
            }' >"$ART/export-manifest.json"

          manifest_sha="$(sha256sum "$ART/export-manifest.json" | awk '{print $1}')"

          echo "V1_8_EXPORT_REGISTRY_SHA256=$registry_sha"
          echo "V1_8_EXPORT_EVENT_SET_SHA256=$event_set_sha"
          echo "V1_8_EXPORT_MANIFEST_SHA256=$manifest_sha"

          echo "registry_sha=$registry_sha" >>"$GITHUB_OUTPUT"
          echo "event_set_sha=$event_set_sha" >>"$GITHUB_OUTPUT"
          echo "manifest_sha=$manifest_sha" >>"$GITHUB_OUTPUT"

      - name: Persist V1.8 producer bundle as immutable run artifact
        if: steps.v18_export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ess-openshell-v1-8-source-${{ github.run_id }}
          path: /tmp/ess-openshell-live-v1/v1_8-export
          if-no-files-found: error
          overwrite: false
          retention-days: 1
      - name: Emit raw readback bundle to job log
        if: always()
        shell: bash
        run: |
          set +e
          for f in \
            precheck.json landlock.txt seccomp.txt taskmem.txt userns.txt userns-root-map.txt \
            openshell-version.txt gateway-version.txt gateway-info.txt listeners.txt \
            providers.json sandbox-create.txt sandbox-before-policy.json \
            policy-update.txt policy.json sandbox-after-policy.json \
            network-exec.txt decision-line.txt security-logs.txt \
            ocsf-enable.txt docker-ps.txt supervisor-container-id.txt supervisor-pid.txt supervisor-inspect.json \
            supervisor-var-log-tree.txt ocsf-read.err \
            ocsf.jsonl selected-ocsf-events.json ocsf-identity-source-proof.json \
            ocsf-source-proof-sha256.txt real-receipt.json \
            pinned-v1.4-native-event.json pinned-v1.4-shorthand.txt v1_5-adapter-receipt.json \
            v1_6-pipeline-registry.json v1_6-pipeline-receipt.json \
            v1_7-network-2.txt v1_7-network-3.txt v1_7-network-4.txt \
            v1_7-stream-three.jsonl v1_7-stream-four.jsonl \
            v1_7-init-report.json v1_7-replay-report.json v1_7-append-report.json \
            v1_7-registry-after-init.json v1_7-registry-after-replay.json v1_7-registry-after-fourth.json \
            v1_7-final-receipt.json \
            v1_8-export/canonical-registry.json v1_8-export/pinned-event-set.jsonl \
            v1_8-export/v1_7-final-receipt.json v1_8-export/export-manifest.json \
            v1_8-source-download/canonical-registry.json v1_8-source-download/pinned-event-set.jsonl \
            v1_8-source-download/export-manifest.json v1_8-phase1-replay.json \
            v1_8-current-before-uids.json v1_8-new-live-event.txt v1_8-current-after-new.jsonl \
            v1_8-rehydrated-registry.json v1_8-final-receipt.json \
            gateway.log; do
            echo "===== $f ====="
            cat "$WORKDIR/$f" 2>/dev/null || echo "[MISSING]"
          done

      - name: Fail closed unless live native UID single-event bind passes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$WORKDIR/real-receipt.json" ]; then
            echo "FINAL_GATE=HOLD_NO_RECEIPT"
            exit 1
          fi

          verdict="$(jq -r '.verdict' "$WORKDIR/real-receipt.json")"
          single="$(jq -r '.single_event_verdict' "$WORKDIR/real-receipt.json")"
          uid="$(jq -r '.provider_native_uid // empty' "$WORKDIR/real-receipt.json")"
          container_eq="$(jq -r '.requirements.CONTAINER_UID_EQUALS_RUNTIME_SANDBOX_ID' "$WORKDIR/real-receipt.json")"
          same_event="$(jq -r '.requirements.ESS_LOG_REFERENCE_SAME_OBSERVED_EVENT' "$WORKDIR/real-receipt.json")"
          cross="$(jq -r '.strict_cross_event_claim.verdict' "$WORKDIR/real-receipt.json")"

          echo "FINAL_GATE=$verdict"
          echo "SINGLE_EVENT_GATE=$single"
          echo "PROVIDER_NATIVE_UID=$uid"
          echo "CONTAINER_UID_EQUALS_RUNTIME_SANDBOX_ID=$container_eq"
          echo "ESS_LOG_REFERENCE_SAME_OBSERVED_EVENT=$same_event"
          echo "STRICT_CROSS_EVENT_GATE=$cross"

          [ "$single" = "PASS_LIVE_NATIVE_OCSF_UID_SINGLE_EVENT_BIND" ]
          [ -n "$uid" ]
          [ "$container_eq" = "true" ]
          [ "$same_event" = "true" ]
          [ "$cross" = "HOLD_NATIVE_CORRELATION_UID_NOT_POPULATABLE_BY_V0_1_2_TYPED_METADATA_MODEL" ]
          [ "$verdict" = "PASS_LIVE_NATIVE_OCSF_UID_CAPTURE_V1_4__HOLD_STRICT_CROSS_EVENT_CORRELATION" ]

          if [ ! -f "$WORKDIR/v1_5-adapter-receipt.json" ]; then
            echo "V1_5_GATE=HOLD_NO_ADAPTER_RECEIPT"
            exit 1
          fi

          v15="$(jq -r '.verdict' "$WORKDIR/v1_5-adapter-receipt.json")"
          replay_equal="$(jq -r '.canonical_replay_equality' "$WORKDIR/v1_5-adapter-receipt.json")"
          mutation="$(jq -r '.mutation.verdict' "$WORKDIR/v1_5-adapter-receipt.json")"
          cross15="$(jq -r '.strict_cross_event_claim.verdict' "$WORKDIR/v1_5-adapter-receipt.json")"

          echo "V1_5_GATE=$v15"
          echo "V1_5_REPLAY_EQUALITY=$replay_equal"
          echo "V1_5_MUTATION_VERDICT=$mutation"
          echo "V1_5_STRICT_CROSS_EVENT_GATE=$cross15"

          [ "$v15" = "PASS_REAL_NATIVE_EVENT_ASSURANCE_ADAPTER_BIND_AND_REPLAY_V1_5" ]
          [ "$replay_equal" = "true" ]
          [ "$mutation" = "HOLD" ]
          [ "$cross15" = "HOLD_NATIVE_CORRELATION_UID_NOT_POPULATABLE_BY_V0_1_2_TYPED_METADATA_MODEL" ]

          if [ ! -f "$WORKDIR/v1_6-pipeline-receipt.json" ]; then
            echo "V1_6_GATE=HOLD_NO_PIPELINE_RECEIPT"
            exit 1
          fi

          v16="$(jq -r '.verdict' "$WORKDIR/v1_6-pipeline-receipt.json")"
          replay16="$(jq -r '.replay.equal' "$WORKDIR/v1_6-pipeline-receipt.json")"
          dup16="$(jq -r '.duplicate_uid_idempotency.equal' "$WORKDIR/v1_6-pipeline-receipt.json")"
          missing16="$(jq -r '.stream.missing_uid_count' "$WORKDIR/v1_6-pipeline-receipt.json")"
          cross16="$(jq -r '.strict_cross_event_claim.verdict' "$WORKDIR/v1_6-pipeline-receipt.json")"

          echo "V1_6_GATE=$v16"
          echo "V1_6_REPLAY_EQUALITY=$replay16"
          echo "V1_6_DUPLICATE_IDEMPOTENCY=$dup16"
          echo "V1_6_MISSING_UID_COUNT=$missing16"
          echo "V1_6_STRICT_CROSS_EVENT_GATE=$cross16"

          [ "$v16" = "PASS_LIVE_STREAM_TO_ASSURANCE_RECEIPT_PIPELINE_V1_6" ]
          [ "$replay16" = "true" ]
          [ "$dup16" = "true" ]
          [ "$missing16" = "0" ]
          [ "$cross16" = "HOLD_NATIVE_CORRELATION_UID_NOT_POPULATABLE_BY_V0_1_2_TYPED_METADATA_MODEL" ]

          if [ ! -f "$WORKDIR/v1_7-final-receipt.json" ]; then
            echo "V1_7_GATE=HOLD_NO_FINAL_RECEIPT"
            exit 1
          fi

          v17="$(jq -r '.verdict' "$WORKDIR/v1_7-final-receipt.json")"
          d3="$(jq -r '.init.distinct_provider_native_uid_count' "$WORKDIR/v1_7-final-receipt.json")"
          d4="$(jq -r '.append.distinct_provider_native_uid_count' "$WORKDIR/v1_7-final-receipt.json")"
          n4="$(jq -r '.append.new_receipt_count' "$WORKDIR/v1_7-final-receipt.json")"
          restart_eq="$(jq -r '.requirements.REGISTRY_EQUALITY_BEFORE_AFTER_RESTART' "$WORKDIR/v1_7-final-receipt.json")"
          receipt_eq="$(jq -r '.requirements.RECEIPT_HASH_EQUALITY_BEFORE_AFTER_RESTART' "$WORKDIR/v1_7-final-receipt.json")"
          cross17="$(jq -r '.strict_cross_event_claim.verdict' "$WORKDIR/v1_7-final-receipt.json")"

          echo "V1_7_GATE=$v17"
          echo "V1_7_DISTINCT_UIDS_INITIAL=$d3"
          echo "V1_7_DISTINCT_UIDS_FINAL=$d4"
          echo "V1_7_NEW_RECEIPTS_AFTER_FOURTH=$n4"
          echo "V1_7_REGISTRY_RESTART_EQUALITY=$restart_eq"
          echo "V1_7_RECEIPT_HASH_RESTART_EQUALITY=$receipt_eq"
          echo "V1_7_STRICT_CROSS_EVENT_GATE=$cross17"

          [ "$v17" = "PASS_MULTI_EVENT_STREAM_CONTINUITY_AND_RESTART_PERSISTENCE_V1_7" ]
          [ "$d3" = "3" ]
          [ "$d4" = "4" ]
          [ "$n4" = "1" ]
          [ "$restart_eq" = "true" ]
          [ "$receipt_eq" = "true" ]
          [ "$cross17" = "HOLD_NATIVE_CORRELATION_UID_NOT_POPULATABLE_BY_V0_1_2_TYPED_METADATA_MODEL" ]

          if [ ! -f "$WORKDIR/v1_8-final-receipt.json" ]; then
            echo "V1_8_GATE=HOLD_NO_FINAL_RECEIPT"
            exit 1
          fi

          v18="$(jq -r '.verdict' "$WORKDIR/v1_8-final-receipt.json")"
          byteeq="$(jq -r '.requirements.SOURCE_ARTIFACT_BYTE_SHA_EQUALITY' "$WORKDIR/v1_8-final-receipt.json")"
          replay0="$(jq -r '.requirements.REPLAY_ZERO_NEW_RECEIPTS' "$WORKDIR/v1_8-final-receipt.json")"
          regeq="$(jq -r '.requirements.REGISTRY_HASH_EQUALITY_AFTER_REPLAY' "$WORKDIR/v1_8-final-receipt.json")"
          receq="$(jq -r '.requirements.RECEIPT_HASH_EQUALITY_AFTER_REPLAY' "$WORKDIR/v1_8-final-receipt.json")"
          oneuid="$(jq -r '.requirements.EXACTLY_ONE_NEW_UID' "$WORKDIR/v1_8-final-receipt.json")"
          onereceipt="$(jq -r '.requirements.EXACTLY_ONE_NEW_RECEIPT' "$WORKDIR/v1_8-final-receipt.json")"
          freshsandbox="$(jq -r '.requirements.FRESH_SANDBOX_ID_DIFFERS' "$WORKDIR/v1_8-final-receipt.json")"
          cross18="$(jq -r '.strict_cross_event_claim.verdict' "$WORKDIR/v1_8-final-receipt.json")"

          echo "V1_8_GATE=$v18"
          echo "V1_8_SOURCE_BYTE_EQUALITY=$byteeq"
          echo "V1_8_REPLAY_ZERO_NEW_RECEIPTS=$replay0"
          echo "V1_8_REGISTRY_REPLAY_EQUALITY=$regeq"
          echo "V1_8_RECEIPT_HASH_EQUALITY=$receq"
          echo "V1_8_EXACTLY_ONE_NEW_UID=$oneuid"
          echo "V1_8_EXACTLY_ONE_NEW_RECEIPT=$onereceipt"
          echo "V1_8_FRESH_SANDBOX_ID_DIFFERS=$freshsandbox"
          echo "V1_8_STRICT_CROSS_EVENT_GATE=$cross18"

          [ "$v18" = "PASS_CROSS_RUN_DURABLE_REGISTRY_REHYDRATION_V1_8" ]
          [ "$byteeq" = "true" ]
          [ "$replay0" = "true" ]
          [ "$regeq" = "true" ]
          [ "$receq" = "true" ]
          [ "$oneuid" = "true" ]
          [ "$onereceipt" = "true" ]
          [ "$freshsandbox" = "true" ]
          [ "$cross18" = "HOLD_NATIVE_CORRELATION_UID_NOT_POPULATABLE_BY_V0_1_2_TYPED_METADATA_MODEL" ]
