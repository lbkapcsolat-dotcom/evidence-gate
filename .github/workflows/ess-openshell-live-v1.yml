name: ESS OpenShell Live Sandbox V1

on:
  push:
    branches:
      - test/openshell-live-v1

permissions:
  contents: read

jobs:
  openshell-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENSHELL_VERSION: v0.1.2
      OPENSHELL_TAG_COMMIT: 6648bd0c290efbc41ba131ee9831ee45cd431f94
      PINNED_REAL_NET_OPEN_RUN: "36919702193"
      PINNED_REAL_NET_OPEN_SOURCE_SHA: 1a9ef90abb64a50771b728d6b7fd8c74ac6beb2a
      WORKDIR: /tmp/ess-openshell-live-v1
    steps:
      - name: Prepare capability probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORKDIR"
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential jq curl ca-certificates util-linux

          cat > "$WORKDIR/landlock_probe.c" <<'EOF'
          #define _GNU_SOURCE
          #include <linux/landlock.h>
          #include <sys/syscall.h>
          #include <unistd.h>
          #include <stdio.h>
          #include <errno.h>
          #include <string.h>
          int main(void) {
              long abi = syscall(SYS_landlock_create_ruleset, NULL, 0, LANDLOCK_CREATE_RULESET_VERSION);
              if (abi < 0) {
                  fprintf(stderr, "landlock_create_ruleset failed: %s\n", strerror(errno));
                  return 1;
              }
              printf("LANDLOCK_ABI=%ld\n", abi);
              return abi >= 3 ? 0 : 2;
          }
          EOF

          cat > "$WORKDIR/seccomp_notify_probe.c" <<'EOF'
          #define _GNU_SOURCE
          #include <linux/seccomp.h>
          #include <linux/filter.h>
          #include <sys/prctl.h>
          #include <sys/syscall.h>
          #include <stddef.h>
          #include <unistd.h>
          #include <stdio.h>
          #include <errno.h>
          #include <string.h>
          int main(void) {
              struct sock_filter filter[] = {
                  BPF_STMT(BPF_LD | BPF_W | BPF_ABS, offsetof(struct seccomp_data, nr)),
                  BPF_JUMP(BPF_JMP | BPF_JEQ | BPF_K, __NR_getpid, 0, 1),
                  BPF_STMT(BPF_RET | BPF_K, SECCOMP_RET_USER_NOTIF),
                  BPF_STMT(BPF_RET | BPF_K, SECCOMP_RET_ALLOW),
              };
              struct sock_fprog prog = {
                  .len = (unsigned short)(sizeof(filter)/sizeof(filter[0])),
                  .filter = filter
              };
              if (prctl(PR_SET_NO_NEW_PRIVS, 1, 0, 0, 0) != 0) {
                  fprintf(stderr, "PR_SET_NO_NEW_PRIVS failed: %s\n", strerror(errno));
                  return 1;
              }
              long fd = syscall(SYS_seccomp, SECCOMP_SET_MODE_FILTER,
                                SECCOMP_FILTER_FLAG_NEW_LISTENER, &prog);
              if (fd < 0) {
                  fprintf(stderr, "seccomp NEW_LISTENER failed: %s\n", strerror(errno));
                  return 2;
              }
              printf("SECCOMP_USER_NOTIFICATION_LISTENER_FD=%ld\n", fd);
              close((int)fd);
              return 0;
          }
          EOF

          cat > "$WORKDIR/task_memory_probe.c" <<'EOF'
          #define _GNU_SOURCE
          #include <sys/uio.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <unistd.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <signal.h>
          #include <string.h>
          #include <errno.h>
          int main(void) {
              int p[2];
              if (pipe(p) != 0) return 1;
              pid_t child = fork();
              if (child < 0) return 2;
              if (child == 0) {
                  close(p[0]);
                  volatile int secret = 0x12345678;
                  uintptr_t addr = (uintptr_t)&secret;
                  if (write(p[1], &addr, sizeof(addr)) != sizeof(addr)) _exit(3);
                  sleep(10);
                  _exit(0);
              }
              close(p[1]);
              uintptr_t addr = 0;
              if (read(p[0], &addr, sizeof(addr)) != sizeof(addr)) {
                  kill(child, SIGKILL); waitpid(child, NULL, 0); return 4;
              }
              int value = 0;
              struct iovec local = {.iov_base=&value, .iov_len=sizeof(value)};
              struct iovec remote = {.iov_base=(void*)addr, .iov_len=sizeof(value)};
              ssize_t n = process_vm_readv(child, &local, 1, &remote, 1, 0);
              int saved = errno;
              kill(child, SIGKILL);
              waitpid(child, NULL, 0);
              if (n != sizeof(value)) {
                  fprintf(stderr, "process_vm_readv failed: %s\n", strerror(saved));
                  return 5;
              }
              printf("TASK_MEMORY_VALUE=0x%x\n", value);
              return value == 0x12345678 ? 0 : 6;
          }
          EOF

          gcc -O2 -Wall -Wextra "$WORKDIR/landlock_probe.c" -o "$WORKDIR/landlock_probe"
          gcc -O2 -Wall -Wextra "$WORKDIR/seccomp_notify_probe.c" -o "$WORKDIR/seccomp_notify_probe"
          gcc -O2 -Wall -Wextra "$WORKDIR/task_memory_probe.c" -o "$WORKDIR/task_memory_probe"

      - name: Run fail-closed Linux capability precheck
        id: precheck
        shell: bash
        run: |
          set +e
          LANDLOCK=false
          SECCOMP=false
          TASKMEM=false
          USERNS=false
          CONTAINER=false

          "$WORKDIR/landlock_probe" >"$WORKDIR/landlock.txt" 2>&1
          [ $? -eq 0 ] && LANDLOCK=true

          "$WORKDIR/seccomp_notify_probe" >"$WORKDIR/seccomp.txt" 2>&1
          [ $? -eq 0 ] && SECCOMP=true

          "$WORKDIR/task_memory_probe" >"$WORKDIR/taskmem.txt" 2>&1
          [ $? -eq 0 ] && TASKMEM=true

          unshare --user true >"$WORKDIR/userns.txt" 2>&1
          [ $? -eq 0 ] && USERNS=true

          USERNS_ROOT_MAP=false
          unshare --user --map-root-user true >"$WORKDIR/userns-root-map.txt" 2>&1
          [ $? -eq 0 ] && USERNS_ROOT_MAP=true

          docker info >"$WORKDIR/docker-info.txt" 2>&1 &&
          docker run --rm docker.io/library/alpine:3.20 true >>"$WORKDIR/docker-info.txt" 2>&1
          [ $? -eq 0 ] && CONTAINER=true

          PASS=false
          if $LANDLOCK && $SECCOMP && $TASKMEM && $USERNS && $CONTAINER; then
            PASS=true
          fi

          jq -n \
            --argjson landlock "$LANDLOCK" \
            --argjson seccomp "$SECCOMP" \
            --argjson task_memory "$TASKMEM" \
            --argjson user_namespace "$USERNS" \
            --argjson user_namespace_root_map "$USERNS_ROOT_MAP" \
            --argjson container_runtime "$CONTAINER" \
            --argjson pass "$PASS" \
            '{
              LANDLOCK_ABI:$landlock,
              SECCOMP_USER_NOTIFICATION:$seccomp,
              TASK_MEMORY_ACCESS:$task_memory,
              USER_NAMESPACE:$user_namespace,
              USER_NAMESPACE_ROOT_MAP_DIAGNOSTIC:$user_namespace_root_map,
              CONTAINER_RUNTIME:$container_runtime,
              PRECHECK_PASS:$pass
            }' > "$WORKDIR/precheck.json"

          cat "$WORKDIR/precheck.json"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"

      - name: Install pinned official OpenShell v0.1.2 and verify release SHA
        if: steps.precheck.outputs.pass == 'true'
        id: install
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORKDIR/download" "$WORKDIR/bin" "$WORKDIR/tls"

          base="https://github.com/NVIDIA/OpenShell/releases/download/v0.1.2"
          curl -L --fail --silent --show-error -o "$WORKDIR/download/openshell.tar.gz" \
            "$base/openshell-x86_64-unknown-linux-musl.tar.gz"
          curl -L --fail --silent --show-error -o "$WORKDIR/download/gateway.tar.gz" \
            "$base/openshell-gateway-x86_64-unknown-linux-gnu.tar.gz"
          curl -L --fail --silent --show-error -o "$WORKDIR/download/supervisor.tar.gz" \
            "$base/openshell-supervisor-x86_64-unknown-linux-gnu.tar.gz"
          curl -L --fail --silent --show-error -o "$WORKDIR/download/sandbox.tar.gz" \
            "$base/openshell-sandbox-x86_64-unknown-linux-musl.tar.gz"

          echo "7eb6917285331a09e3300266a0558616481a5e9927cae2612ea07c4045b6dd6f  $WORKDIR/download/openshell.tar.gz" | sha256sum -c -
          echo "218d887845b3a020ab7535c9985eb9c666d6938f144044957f8b82b42892aadb  $WORKDIR/download/gateway.tar.gz" | sha256sum -c -
          echo "801d717f4211b4c24449b08a47ce5571ff623ce993c10d44e133dbe2edc36611  $WORKDIR/download/supervisor.tar.gz" | sha256sum -c -
          echo "f07ad7177f4c3ff7743f89531eda36bb784c56b45b166f49c5a51fbcfa5274a6  $WORKDIR/download/sandbox.tar.gz" | sha256sum -c -

          tar -xzf "$WORKDIR/download/openshell.tar.gz" -C "$WORKDIR/bin"
          tar -xzf "$WORKDIR/download/gateway.tar.gz" -C "$WORKDIR/bin"
          tar -xzf "$WORKDIR/download/supervisor.tar.gz" -C "$WORKDIR/bin"
          tar -xzf "$WORKDIR/download/sandbox.tar.gz" -C "$WORKDIR/bin"
          chmod +x "$WORKDIR/bin/"*

          "$WORKDIR/bin/openshell" --version | tee "$WORKDIR/openshell-version.txt"
          "$WORKDIR/bin/openshell-gateway" --version | tee "$WORKDIR/gateway-version.txt"
          "$WORKDIR/bin/openshell-supervisor" --version | tee "$WORKDIR/supervisor-version.txt"
          "$WORKDIR/bin/openshell-sandbox" --version | tee "$WORKDIR/sandbox-version.txt"

          "$WORKDIR/bin/openshell-gateway" generate-certs \
            --output-dir "$WORKDIR/tls" \
            --server-san 127.0.0.1 \
            --server-san localhost

          cat > "$WORKDIR/gateway.toml" <<EOF
          [openshell]
          version = 2

          [openshell.gateway]
          bind_address = "127.0.0.1:17670"
          log_level = "info"
          compute_driver = "docker"
          disable_tls = true

          [openshell.gateway.auth]
          allow_unauthenticated_users = true

          [openshell.gateway.gateway_jwt]
          signing_key_path = "$WORKDIR/tls/jwt/signing.pem"
          public_key_path = "$WORKDIR/tls/jwt/public.pem"
          kid_path = "$WORKDIR/tls/jwt/kid"
          gateway_id = "ess-gha-live-v1"
          ttl_secs = 3600

          [openshell.drivers.docker]
          default_image = "python:3.12-slim"
          image_pull_policy = "if_not_present"
          sandbox_label = "ess-gha-live-v1"
          EOF

          "$WORKDIR/bin/openshell-gateway" config preflight --path "$WORKDIR/gateway.toml"
          sha256sum "$WORKDIR/gateway.toml" > "$WORKDIR/gateway-config.sha256"

      - name: Prove pinned OCSF identity and correlation semantics
        if: steps.precheck.outputs.pass == 'true'
        id: identity_model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORKDIR/ocsf-source-proof"

          raw="https://raw.githubusercontent.com/NVIDIA/OpenShell/v0.1.2"
          curl -L --fail --silent --show-error             "$raw/crates/openshell-ocsf/tests/event_identity.rs"             -o "$WORKDIR/ocsf-source-proof/event_identity.rs"
          curl -L --fail --silent --show-error             "$raw/crates/openshell-ocsf/src/objects/metadata.rs"             -o "$WORKDIR/ocsf-source-proof/metadata.rs"
          curl -L --fail --silent --show-error             "$raw/crates/openshell-ocsf/src/builders/mod.rs"             -o "$WORKDIR/ocsf-source-proof/builders-mod.rs"
          curl -L --fail --silent --show-error             "$raw/crates/openshell-ocsf/schemas/ocsf/v1.8.0/objects/metadata.json"             -o "$WORKDIR/ocsf-source-proof/metadata-schema.json"
          curl -L --fail --silent --show-error             "$raw/proto/openshell.proto"             -o "$WORKDIR/ocsf-source-proof/openshell.proto"

          sha256sum "$WORKDIR"/ocsf-source-proof/*             > "$WORKDIR/ocsf-source-proof-sha256.txt"

          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          root = Path(os.environ["WORKDIR"]) / "ocsf-source-proof"
          event_tests = (root / "event_identity.rs").read_text()
          metadata_rs = (root / "metadata.rs").read_text()
          builders = (root / "builders-mod.rs").read_text()
          schema = json.loads((root / "metadata-schema.json").read_text())
          proto = (root / "openshell.proto").read_text()

          attrs = schema.get("attributes", {})
          uid_schema = attrs.get("uid") or {}
          corr_schema = attrs.get("correlation_uid") or {}

          event_uid_generated = (
              'uid: Some(uuid::Uuid::new_v4().to_string())' in builders
              and "each_event_gets_its_own_metadata_uid" in event_tests
              and 'json["container"]["uid"]' in event_tests
          )
          sandbox_uid_distinct = (
              "metadata_uid_is_no_longer_the_sandbox_id" in event_tests
              and "the_sandbox_id_is_carried_by_the_container" in event_tests
          )
          correlation_in_schema = bool(corr_schema)
          correlation_in_runtime_metadata = bool(
              re.search(r'\bcorrelation_uid\s*:', metadata_rs)
          )

          # Transport identifiers are distinct schema fields/namespaces from OCSF metadata.uid.
          stream_cursor_declared = bool(re.search(r'\bstring\s+cursor\s*=\s*\d+\s*;', proto))
          gateway_channel_declared = bool(re.search(r'\bstring\s+channel_id\s*=\s*\d+\s*;', proto))

          proof = {
              "gate": "ESS__NVIDIA_OPENSHELL__OCSF_EVENT_IDENTITY_AND_CORRELATION_MODEL_V1_3",
              "openshell_version": "v0.1.2",
              "openshell_tag_commit": os.environ["OPENSHELL_TAG_COMMIT"],
              "event_id_semantics": {
                  "field": "metadata.uid",
                  "schema_caption": uid_schema.get("caption"),
                  "schema_description": uid_schema.get("description"),
                  "generated_per_event": event_uid_generated,
              },
              "sandbox_id_semantics": {
                  "field": "container.uid",
                  "distinct_from_event_id": sandbox_uid_distinct,
              },
              "transport_identity_semantics": {
                  "stream_cursor_field_declared": stream_cursor_declared,
                  "stream_cursor_is_event_id": False,
                  "gateway_channel_id_field_declared": gateway_channel_declared,
                  "gateway_channel_id_is_event_id": False,
                  "note": "Different protocol/schema identifier namespaces; no value substitution is permitted."
              },
              "cross_event_correlation": {
                  "field": "metadata.correlation_uid",
                  "ocsf_schema_support": correlation_in_schema,
                  "schema_requirement": corr_schema.get("requirement"),
                  "schema_description": corr_schema.get("description"),
                  "runtime_metadata_struct_support": correlation_in_runtime_metadata,
                  "population_status": (
                      "SUPPORTED_BY_RUNTIME_MODEL"
                      if correlation_in_runtime_metadata
                      else "HOLD_NOT_POPULATABLE_BY_V0_1_2_TYPED_METADATA_MODEL"
                  ),
              },
              "proof_bar_reduced": False,
          }

          required = [
              event_uid_generated,
              sandbox_uid_distinct,
              correlation_in_schema,
              stream_cursor_declared,
              gateway_channel_declared,
          ]
          proof["source_semantics_pass"] = all(required)
          (Path(os.environ["WORKDIR"]) / "ocsf-identity-source-proof.json").write_text(
              json.dumps(proof, indent=2, sort_keys=True)
          )
          print(json.dumps(proof, indent=2, sort_keys=True))
          if not proof["source_semantics_pass"]:
              raise SystemExit(1)
          PY

      - name: Start localhost-only gateway and create real minimal sandbox
        if: steps.precheck.outputs.pass == 'true'
        id: runtime
        shell: bash
        run: |
          set +e
          export PATH="$WORKDIR/bin:$PATH"
          export OPENSHELL_DB_URL="sqlite:$WORKDIR/gateway.db?mode=rwc"

          nohup "$WORKDIR/bin/openshell-gateway" --config "$WORKDIR/gateway.toml" \
            >"$WORKDIR/gateway.log" 2>&1 &
          echo $! > "$WORKDIR/gateway.pid"

          GATEWAY_OK=false
          for i in $(seq 1 30); do
            openshell gateway add --name ess-gha-live --local http://127.0.0.1:17670 >/dev/null 2>&1 || true
            openshell gateway select ess-gha-live >/dev/null 2>&1 || true
            openshell gateway info >"$WORKDIR/gateway-info.txt" 2>&1
            if [ $? -eq 0 ]; then
              GATEWAY_OK=true
              break
            fi
            sleep 1
          done

          ss -ltnp >"$WORKDIR/listeners.txt" 2>&1 || true
          openshell provider list -o json >"$WORKDIR/providers.json" 2>&1 || true

          SANDBOX_RC=99
          if $GATEWAY_OK; then
            openshell sandbox create \
              --name ess-gha-live-v1 \
              --from python:3.12-slim \
              --no-auto-providers \
              --detach -- sleep 300 \
              >"$WORKDIR/sandbox-create.txt" 2>&1
            SANDBOX_RC=$?
          fi

          openshell sandbox get ess-gha-live-v1 -o json \
            >"$WORKDIR/sandbox-before-policy.json" 2>"$WORKDIR/sandbox-get.err" || true
          openshell logs ess-gha-live-v1 -n 300 --source all \
            >"$WORKDIR/logs-before-policy.txt" 2>&1 || true

          READY=false
          if jq -e '.conditions[]? | select(.type=="Ready" and .status=="True")' \
              "$WORKDIR/sandbox-before-policy.json" >/dev/null 2>&1; then
            READY=true
          fi

          echo "gateway_ok=$GATEWAY_OK" >> "$GITHUB_OUTPUT"
          echo "sandbox_ready=$READY" >> "$GITHUB_OUTPUT"
          echo "sandbox_create_rc=$SANDBOX_RC" >> "$GITHUB_OUTPUT"

          echo "GATEWAY_OK=$GATEWAY_OK"
          echo "SANDBOX_READY=$READY"
          cat "$WORKDIR/gateway-info.txt" 2>/dev/null || true
          cat "$WORKDIR/sandbox-before-policy.json" 2>/dev/null || true

      - name: Run one controlled network policy event and capture real evidence
        if: steps.precheck.outputs.pass == 'true' && steps.runtime.outputs.sandbox_ready == 'true'
        id: event
        shell: bash
        run: |
          set +e
          export PATH="$WORKDIR/bin:$PATH"

          # Enable full provider-native OCSF JSONL so metadata.uid is available.
          openshell settings set ess-gha-live-v1 --key ocsf_json_enabled --value true \
            >"$WORKDIR/ocsf-enable.txt" 2>&1
          OCSF_ENABLE_RC=$?
          sleep 12

          CALLER_PATH="$(openshell sandbox exec -n ess-gha-live-v1 --no-login-shell -- \
            sh -c 'readlink -f "$(command -v python3)"' 2>/dev/null | tail -n 1)"
          printf '%s\n' "$CALLER_PATH" > "$WORKDIR/caller-path.txt"

          openshell policy update ess-gha-live-v1 \
            --add-endpoint example.com:443:read-only:rest:enforce \
            --binary "$CALLER_PATH" \
            --rule-name ess-example-read \
            --wait --timeout 60 \
            >"$WORKDIR/policy-update.txt" 2>&1
          POLICY_RC=$?

          openshell policy get ess-gha-live-v1 --full -o json \
            >"$WORKDIR/policy.json" 2>"$WORKDIR/policy.err"
          POLICY_GET_RC=$?

          openshell sandbox get ess-gha-live-v1 -o json \
            >"$WORKDIR/sandbox-after-policy.json" 2>"$WORKDIR/sandbox-after.err"

          openshell sandbox exec -n ess-gha-live-v1 --no-login-shell -- \
            "$CALLER_PATH" -c \
            "import urllib.request; r=urllib.request.urlopen('https://example.com/', timeout=15); print('HTTP_STATUS='+str(r.status))" \
            >"$WORKDIR/network-exec.txt" 2>&1
          EXEC_RC=$?

          sleep 2
          openshell logs ess-gha-live-v1 --since 10m --source all \
            >"$WORKDIR/security-logs.txt" 2>&1
          LOG_RC=$?

          MATCH_LINE="$(grep -E 'NET:OPEN.*ALLOWED' "$WORKDIR/security-logs.txt" | grep -F 'example.com:443' | tail -n 1)"
          printf '%s\n' "$MATCH_LINE" > "$WORKDIR/decision-line.txt"

          # The Docker driver separates workload and supervisor containers.
          # Full OCSF JSONL is written by the supervisor companion, so read it
          # directly from that container rather than from the workload.
          SANDBOX_ID="$(jq -r '.id // empty' "$WORKDIR/sandbox-after-policy.json")"
          docker ps -a --format '{{.ID}} {{.Names}} {{.Image}} {{.Labels}}' \
            >"$WORKDIR/docker-ps.txt" 2>&1 || true
          SUPERVISOR_CONTAINER="$(docker ps -a \
            --filter "label=openshell.ai/sandbox-id=$SANDBOX_ID" \
            --filter "label=openshell.ai/isolation-role=supervisor" \
            -q | head -n 1)"
          printf '%s\n' "$SUPERVISOR_CONTAINER" > "$WORKDIR/supervisor-container-id.txt"

          if [ -n "$SUPERVISOR_CONTAINER" ]; then
            # Supervisor image is intentionally minimal/distroless and has no shell.
            # docker cp/export use the daemon archive API and do not require an in-container shell.
            docker inspect "$SUPERVISOR_CONTAINER" >"$WORKDIR/supervisor-inspect.json" 2>&1 || true
            docker export "$SUPERVISOR_CONTAINER" | tar -tf - | grep -E '(^|/)var/log|openshell-ocsf' \
              >"$WORKDIR/supervisor-log-tree.txt" 2>&1 || true

            rm -rf "$WORKDIR/supervisor-var-log"
            mkdir -p "$WORKDIR/supervisor-var-log"
            docker cp "$SUPERVISOR_CONTAINER:/var/log/." "$WORKDIR/supervisor-var-log/" \
              2>"$WORKDIR/ocsf-read.err"
            OCSF_COPY_RC=$?
            find "$WORKDIR/supervisor-var-log" -maxdepth 3 -printf '%y %p\n' \
              >"$WORKDIR/supervisor-var-log-tree.txt" 2>&1 || true
            cat "$WORKDIR"/supervisor-var-log/openshell-ocsf.*.log \
              >"$WORKDIR/ocsf.jsonl" 2>>"$WORKDIR/ocsf-read.err"
            OCSF_CAT_RC=$?
            if [ "$OCSF_COPY_RC" -eq 0 ] && [ "$OCSF_CAT_RC" -eq 0 ]; then
              OCSF_READ_RC=0
            else
              OCSF_READ_RC=45
            fi
          else
            : >"$WORKDIR/ocsf.jsonl"
            echo "SUPERVISOR_CONTAINER_NOT_FOUND" >"$WORKDIR/ocsf-read.err"
            OCSF_READ_RC=44
          fi

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["WORKDIR"])
          net = []
          http = []
          for raw in (root / "ocsf.jsonl").read_text(errors="replace").splitlines():
              try:
                  e = json.loads(raw)
              except Exception:
                  continue
              if e.get("class_uid") == 4001:
                  dst = e.get("dst_endpoint") or {}
                  fw = e.get("firewall_rule") or {}
                  if (
                      e.get("action") == "Allowed"
                      and dst.get("domain") == "example.com"
                      and dst.get("port") == 443
                      and fw.get("name") == "ess-example-read"
                  ):
                      net.append(e)
              if e.get("class_uid") == 4002:
                  dst = e.get("dst_endpoint") or {}
                  fw = e.get("firewall_rule") or {}
                  if (
                      e.get("action") == "Allowed"
                      and dst.get("domain") == "example.com"
                      and dst.get("port") == 443
                      and fw.get("name") == "ess-example-read"
                  ):
                      http.append(e)

          selected = {
              "network_authorization_event": net[-1] if net else None,
              "http_execution_event": http[-1] if http else None,
          }
          (root / "selected-ocsf-events.json").write_text(
              json.dumps(selected, indent=2, sort_keys=True)
          )
          PY

          echo "policy_rc=$POLICY_RC" >> "$GITHUB_OUTPUT"
          echo "policy_get_rc=$POLICY_GET_RC" >> "$GITHUB_OUTPUT"
          echo "exec_rc=$EXEC_RC" >> "$GITHUB_OUTPUT"
          echo "log_rc=$LOG_RC" >> "$GITHUB_OUTPUT"
          echo "ocsf_enable_rc=$OCSF_ENABLE_RC" >> "$GITHUB_OUTPUT"
          echo "ocsf_read_rc=$OCSF_READ_RC" >> "$GITHUB_OUTPUT"

          echo "CALLER_PATH=$CALLER_PATH"
          echo "POLICY_RC=$POLICY_RC"
          echo "EXEC_RC=$EXEC_RC"
          echo "DECISION_LINE=$MATCH_LINE"
          echo "SELECTED_OCSF_EVENTS:"
          cat "$WORKDIR/selected-ocsf-events.json" 2>/dev/null || true

      - name: Rebuild V1.1 receipt semantics under OCSF V1.3 model
        if: always()
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path

          root = Path(os.environ["WORKDIR"])

          def read_text(name):
              p = root / name
              return p.read_text(errors="replace") if p.exists() else ""

          def read_json(name):
              p = root / name
              if not p.exists():
                  return {}
              try:
                  return json.loads(p.read_text())
              except Exception:
                  return {}

          def sha_text(s):
              return hashlib.sha256(s.encode()).hexdigest() if s else None

          pre = read_json("precheck.json")
          source_proof = read_json("ocsf-identity-source-proof.json")
          sb = read_json("sandbox-after-policy.json") or read_json("sandbox-before-policy.json")
          providers = read_json("providers.json")
          policy = read_json("policy.json")
          logs = read_text("security-logs.txt") or read_text("logs-before-policy.txt")
          line = read_text("decision-line.txt").strip()
          caller_path = read_text("caller-path.txt").strip()
          exec_text = read_text("network-exec.txt")
          selected_ocsf = read_json("selected-ocsf-events.json")
          net_event = selected_ocsf.get("network_authorization_event") or {}
          http_event = selected_ocsf.get("http_execution_event") or {}

          sandbox_id = sb.get("id")
          policy_revision = sb.get("current_policy_version")
          adm = sb.get("configuration_admission") or {}
          policy_hash = adm.get("policy_hash") or None

          decision = "ALLOW" if "ALLOWED" in line else ("DENY" if "DENIED" in line else None)

          destination = "example.com:443" if "example.com:443" in line else None
          caller = (
              caller_path
              if caller_path and (caller_path in line or Path(caller_path).name in line)
              else None
          )
          policy_name_match = re.search(r'\[policy:([^\s\]]+)', line)
          policy_name_from_line = policy_name_match.group(1) if policy_name_match else None

          net_meta = net_event.get("metadata") or {}
          http_meta = http_event.get("metadata") or {}
          net_uid = net_meta.get("uid")
          http_uid = http_meta.get("uid")
          net_corr = net_meta.get("correlation_uid")
          http_corr = http_meta.get("correlation_uid")

          net_actor = ((net_event.get("actor") or {}).get("process") or {})
          net_dst = net_event.get("dst_endpoint") or {}
          net_fw = net_event.get("firewall_rule") or {}

          provider_count = len(providers.get("providers", [])) if isinstance(providers, dict) else None
          execution_success = "HTTP_STATUS=" in exec_text

          fields = {
              "SANDBOX_ID": sandbox_id,
              "POLICY_HASH": policy_hash,
              "POLICY_REVISION_AT_EXECUTION": policy_revision,
              "POLICY_DECISION": decision,
              "CALLER_IDENTITY": net_actor.get("name") or caller,
              "DESTINATION": (
                  f"{net_dst.get('domain')}:{net_dst.get('port')}"
                  if net_dst.get("domain") and net_dst.get("port")
                  else destination
              ),
              "POLICY_NAME": net_fw.get("name") or policy_name_from_line,
              "SECURITY_LOG_REF": sha_text(line),
              "EXECUTION_RESULT": "SUCCESS" if execution_success else "FAILURE",
              "PROVIDER_CREDENTIAL_COUNT": provider_count,
          }

          required_single = [
              "SANDBOX_ID",
              "POLICY_HASH",
              "POLICY_REVISION_AT_EXECUTION",
              "POLICY_DECISION",
              "CALLER_IDENTITY",
              "DESTINATION",
              "POLICY_NAME",
              "SECURITY_LOG_REF",
          ]

          single_missing = next(
              (k for k in required_single if fields.get(k) in (None, "", 0)),
              "NONE"
          )

          exact_policy_pin = (
              fields["POLICY_REVISION_AT_EXECUTION"] == 2
              and fields["POLICY_HASH"]
                  == "518bc9dcbf26319461546e590005d6e7ed7dfadfc22a79ba074a1dc131f2c8ec"
          )

          if not pre.get("PRECHECK_PASS"):
              single_event_verdict = "HOLD_LINUX_CAPABILITY_PRECHECK"
              single_missing = "PRECHECK"
          elif not source_proof.get("source_semantics_pass"):
              single_event_verdict = "HOLD_OCSF_IDENTITY_SOURCE_SEMANTICS"
              single_missing = "OCSF_IDENTITY_SOURCE_SEMANTICS"
          elif not execution_success:
              single_event_verdict = "HOLD_REAL_NETWORK_EXECUTION"
              single_missing = "EXECUTION_RESULT"
          elif single_missing != "NONE":
              single_event_verdict = "HOLD_SINGLE_EVENT_BIND_INCOMPLETE"
          elif decision != "ALLOW":
              single_event_verdict = "HOLD_POLICY_DECISION_NOT_ALLOW"
              single_missing = "POLICY_DECISION_ALLOW"
          elif not exact_policy_pin:
              single_event_verdict = "HOLD_EXACT_POLICY_REVISION_HASH_PIN"
              single_missing = "POLICY_REVISION_HASH_EXACT"
          else:
              single_event_verdict = "PASS_EXACT_NET_OPEN_AUTHORIZATION_EVENT_BIND"

          runtime_corr_support = (
              source_proof.get("cross_event_correlation", {})
              .get("runtime_metadata_struct_support")
          )
          native_correlation_captured = bool(
              net_corr and http_corr and net_corr == http_corr
          )

          if native_correlation_captured:
              cross_event_verdict = "PASS_NATIVE_OCSF_CORRELATION_UID_BIND"
              cross_event_missing = "NONE"
          elif runtime_corr_support is False:
              cross_event_verdict = (
                  "HOLD_NATIVE_CORRELATION_UID_NOT_POPULATABLE_BY_V0_1_2_TYPED_METADATA_MODEL"
              )
              cross_event_missing = "METADATA_CORRELATION_UID_POPULATION"
          else:
              cross_event_verdict = "HOLD_NATIVE_CORRELATION_UID_NOT_CAPTURED"
              cross_event_missing = "METADATA_CORRELATION_UID_CAPTURE"

          native_uid_capture = {
              "field": "metadata.uid",
              "network_event_uid": net_uid,
              "http_event_uid": http_uid,
              "network_uid_capture_status": (
                  "CAPTURED" if net_uid else "HOLD_NOT_CAPTURED_IN_CURRENT_RUNTIME_EXPORT"
              ),
              "http_uid_capture_status": (
                  "CAPTURED" if http_uid else "HOLD_NOT_CAPTURED_IN_CURRENT_RUNTIME_EXPORT"
              ),
              "net_uid_equals_http_uid_required": False,
          }

          old_v1_1 = {
              "old_requirement": "POLICY_DECISION_EVENT_ID == EXECUTION_EVENT_ID",
              "status": "RETIRED_AS_OCSF_SEMANTICALLY_INVALID_FOR_DISTINCT_EVENTS",
              "replacement": (
                  "Single-event authorization claim uses one exact NET:OPEN event; "
                  "cross-event claims require native metadata.correlation_uid or remain HOLD."
              ),
              "proof_bar_reduced": False,
          }

          if single_event_verdict.startswith("PASS_"):
              overall = "PASS_V1_3_SINGLE_EVENT_IDENTITY_MODEL"
              if cross_event_verdict.startswith("HOLD_"):
                  overall += "__HOLD_STRICT_CROSS_EVENT_CORRELATION"
              if not net_uid:
                  overall += "__HOLD_LIVE_NATIVE_UID_CAPTURE"
          else:
              overall = "HOLD_V1_3_MODEL_OR_SINGLE_EVENT_EVIDENCE"

          first_missing = (
              single_missing
              if not single_event_verdict.startswith("PASS_")
              else (
                  "LIVE_PROVIDER_NATIVE_EVENT_UID_CAPTURE"
                  if not net_uid
                  else cross_event_missing
              )
          )

          receipt_body = {
              "schema": "ESS_OPENSHELL_OCSF_EVENT_IDENTITY_RECEIPT_V1_3",
              "gate": "ESS__NVIDIA_OPENSHELL__OCSF_EVENT_IDENTITY_AND_CORRELATION_MODEL_V1_3",
              "openshell_version": "v0.1.2",
              "openshell_tag_commit": os.environ["OPENSHELL_TAG_COMMIT"],
              "pinned_real_net_open_evidence": {
                  "run_id": os.environ["PINNED_REAL_NET_OPEN_RUN"],
                  "source_sha": os.environ["PINNED_REAL_NET_OPEN_SOURCE_SHA"],
                  "current_exact_net_open_line_sha256": sha_text(line),
              },
              "source_repo": os.environ.get("GITHUB_REPOSITORY"),
              "source_ref": os.environ.get("GITHUB_REF"),
              "source_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "precheck": pre,
              "ocsf_identity_source_proof": source_proof,
              "identity_model": {
                  "EVENT_ID": "metadata.uid",
                  "SANDBOX_ID": "container.uid",
                  "STREAM_CURSOR": "transport/watch cursor; not metadata.uid",
                  "GATEWAY_CHANNEL_ID": "gateway relay channel_id; not metadata.uid",
                  "CROSS_EVENT_CORRELATION": "metadata.correlation_uid",
              },
              "single_event_claim": {
                  "claim": (
                      "NET_OPEN_WAS_POLICY_ALLOWED_FOR_EXACT_CALLER_TO_EXACT_DESTINATION_"
                      "UNDER_EXACT_POLICY_REVISION_AND_HASH"
                  ),
                  "primary_event_type": "NET:OPEN",
                  "provider_evidence": fields,
                  "verdict": single_event_verdict,
              },
              "provider_native_event_identity": native_uid_capture,
              "strict_cross_event_claim": {
                  "network_correlation_uid": net_corr,
                  "http_correlation_uid": http_corr,
                  "verdict": cross_event_verdict,
                  "first_missing_proof": cross_event_missing,
              },
              "v1_1_semantics_rebuild": old_v1_1,
              "provider_credentials_attached": provider_count not in (0, None),
              "raw_policy_sha256": sha_text(
                  json.dumps(policy, sort_keys=True, separators=(",",":"))
              ) if policy else None,
              "raw_security_logs_sha256": sha_text(logs),
              "raw_ocsf_jsonl_sha256": sha_text(read_text("ocsf.jsonl")),
              "selected_ocsf_events_sha256": sha_text(
                  json.dumps(selected_ocsf, sort_keys=True, separators=(",",":"))
              ) if selected_ocsf else None,
              "first_missing_proof": first_missing,
              "claim_ceiling": (
                  "EXACT_SINGLE_NET_OPEN_AUTHORIZATION_EVENT_BIND"
                  "__NATIVE_EVENT_UID_SEMANTICS_SOURCE_PROVEN"
                  "__STRICT_CROSS_EVENT_CORRELATION_REMAINS_HOLD_WITHOUT_NATIVE_CORRELATION_UID"
                  "__NO_GENERAL_SECURITY_CLAIM"
                  "__NO_BUSINESS_AUTHORIZATION_CLAIM"
              ),
              "proof_bar_reduced": False,
              "verdict": overall,
          }

          canonical = json.dumps(receipt_body, sort_keys=True, separators=(",",":")).encode()
          receipt_body["receipt_sha256"] = hashlib.sha256(canonical).hexdigest()

          (root / "real-receipt.json").write_text(
              json.dumps(receipt_body, indent=2, sort_keys=True)
          )
          print("ESS_RECEIPT_JSON_BEGIN")
          print(json.dumps(receipt_body, indent=2, sort_keys=True))
          print("ESS_RECEIPT_JSON_END")
          PY

          verdict="$(jq -r '.verdict' "$WORKDIR/real-receipt.json")"
          first_missing="$(jq -r '.first_missing_proof' "$WORKDIR/real-receipt.json")"
          receipt_sha="$(jq -r '.receipt_sha256' "$WORKDIR/real-receipt.json")"
          echo "VERDICT=$verdict"
          echo "FIRST_MISSING_PROOF=$first_missing"
          echo "RECEIPT_SHA256=$receipt_sha"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "receipt_sha=$receipt_sha" >> "$GITHUB_OUTPUT"

      - name: Emit raw readback bundle to job log
        if: always()
        shell: bash
        run: |
          set +e
          for f in \
            precheck.json landlock.txt seccomp.txt taskmem.txt userns.txt userns-root-map.txt \
            openshell-version.txt gateway-version.txt gateway-info.txt listeners.txt \
            providers.json sandbox-create.txt sandbox-before-policy.json \
            policy-update.txt policy.json sandbox-after-policy.json \
            network-exec.txt decision-line.txt security-logs.txt \
            ocsf-enable.txt docker-ps.txt supervisor-container-id.txt supervisor-inspect.json \
            supervisor-log-tree.txt supervisor-var-log-tree.txt ocsf-read.err \
            ocsf.jsonl selected-ocsf-events.json ocsf-identity-source-proof.json \
            ocsf-source-proof-sha256.txt real-receipt.json gateway.log; do
            echo "===== $f ====="
            cat "$WORKDIR/$f" 2>/dev/null || echo "[MISSING]"
          done

      - name: Fail closed on V1.3 model or single-event evidence failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$WORKDIR/real-receipt.json" ]; then
            echo "FINAL_GATE=HOLD_NO_RECEIPT"
            exit 1
          fi

          verdict="$(jq -r '.verdict' "$WORKDIR/real-receipt.json")"
          single="$(jq -r '.single_event_claim.verdict' "$WORKDIR/real-receipt.json")"
          cross="$(jq -r '.strict_cross_event_claim.verdict' "$WORKDIR/real-receipt.json")"
          proof_bar="$(jq -r '.proof_bar_reduced' "$WORKDIR/real-receipt.json")"

          echo "FINAL_GATE=$verdict"
          echo "SINGLE_EVENT_GATE=$single"
          echo "STRICT_CROSS_EVENT_GATE=$cross"
          echo "PROOF_BAR_REDUCED=$proof_bar"

          [ "$proof_bar" = "false" ]
          [ "$single" = "PASS_EXACT_NET_OPEN_AUTHORIZATION_EVENT_BIND" ]

          case "$cross" in
            PASS_NATIVE_OCSF_CORRELATION_UID_BIND|HOLD_NATIVE_CORRELATION_UID_NOT_POPULATABLE_BY_V0_1_2_TYPED_METADATA_MODEL|HOLD_NATIVE_CORRELATION_UID_NOT_CAPTURED)
              ;;
            *)
              echo "UNEXPECTED_CROSS_EVENT_STATE=$cross"
              exit 1
              ;;
          esac

          case "$verdict" in
            PASS_V1_3_SINGLE_EVENT_IDENTITY_MODEL*)
              exit 0
              ;;
            *)
              exit 1
              ;;
          esac
