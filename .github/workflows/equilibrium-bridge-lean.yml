name: Equilibrium Bridge Lean Kernel

on:
  push:
    branches:
      - formal/equilibrium-bridge-kernel-v1
      - formal/equilibrium-bridge-reproof-v1
  pull_request:
    paths:
      - "EquilibriumBridge.lean"
      - "EquilibriumBridgeHarness.lean"
      - "EquilibriumBridgeReproof.lean"
      - "EquilibriumBridgeReproofHarness.lean"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/equilibrium-bridge-lean.yml"
      - "KERNEL_RUN_TRIGGER_V2.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          TOOLCHAIN="$(tr -d '\r\n' < lean-toolchain)"
          elan toolchain install "$TOOLCHAIN"
          lean --version
          lake --version
      - name: Build configured targets
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build
      - name: Proof escape scan
        shell: bash
        run: |
          set -euo pipefail
          files=(EquilibriumBridge.lean EquilibriumBridgeHarness.lean EquilibriumBridgeReproof.lean EquilibriumBridgeReproofHarness.lean)
          present=()
          for f in "${files[@]}"; do
            [[ -f "$f" ]] && present+=("$f")
          done
          if grep -n -E '\bsorry\b|\badmit\b|\baxiom\b' "${present[@]}"; then
            echo "proof escape token found"
            exit 1
          fi
      - name: Existing theorem surface
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean EquilibriumBridgeHarness.lean
      - name: Reconstructed reproof harness
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean EquilibriumBridgeReproofHarness.lean
      - name: SHA256
        shell: bash
        run: |
          set -euo pipefail
          sha256sum EquilibriumBridge.lean EquilibriumBridgeHarness.lean lakefile.toml lean-toolchain
          [[ -f EquilibriumBridgeReproof.lean ]] && sha256sum EquilibriumBridgeReproof.lean
          sha256sum EquilibriumBridgeReproofHarness.lean
