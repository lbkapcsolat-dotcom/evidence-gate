name: Planetary Resource BOM Elexon ENTSOG Temporally Aligned Snapshot Set

on:
  push:
    branches:
      - "feature/planetary-resource-bom-elexon-entsog-temporally-aligned-snapshot-set-v1"
  pull_request:

permissions:
  contents: read

jobs:
  bom-elexon-entsog-temporally-aligned-snapshot-set:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Enforce successor-only changes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            target_sha="${{ github.event.pull_request.head.sha }}"
          else
            target_sha="$GITHUB_SHA"
          fi
          changed="$(git diff --name-only b4eef1a8e63053d1de3eca3410cfbfcabd169294..$target_sha)"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -vE '^(EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__BOM_ELEXON_ENTSOG_TEMPORALLY_ALIGNED_SNAPSHOT_SET\.json|planetary_resource_bom_elexon_entsog_temporally_aligned_snapshot_set_v1\.py|test_planetary_resource_bom_elexon_entsog_temporally_aligned_snapshot_set_v1\.py|docs/planetary_resource_bom_elexon_entsog_temporally_aligned_snapshot_set_v1\.md|sources/elexon/INDO_outturn_alignment_window_2026-09-30.json|sources/entsog/DE-TSO-0005_ITP-00188_entry_2026-09-30_hourly.csv|\.github/workflows/planetary-resource-bom-elexon-entsog-temporally-aligned-snapshot-set\.yml)$' || true)"
          test -z "$forbidden" || { echo "Forbidden predecessor/core change:"; echo "$forbidden"; exit 1; }

      - name: Preserve alternate freshwater predecessor
        run: python -m unittest -v test_planetary_resource_alternate_freshwater_explicit_interval_source_discovery_v1.py

      - name: Run focused three-source alignment test
        run: python -m unittest -v test_planetary_resource_bom_elexon_entsog_temporally_aligned_snapshot_set_v1.py
