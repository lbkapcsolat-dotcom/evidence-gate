name: Planetary Resource Integrated Minimal Core

on:
  push:
    branches:
      - "feature/planetary-resource-integrated-minimal-core-v1"
  pull_request:

permissions:
  contents: read

jobs:
  integrated-minimal-core:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Enforce no frozen-core patch
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            target_sha="${{ github.event.pull_request.head.sha }}"
          else
            target_sha="$GITHUB_SHA"
          fi
          changed="$(git diff --name-only 4854040726bf24163f6ec70521d1ee7b4ac47f7d..$target_sha)"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -vE '^(EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__INTEGRATED_MINIMAL_PLANETARY_CORE\.json|planetary_resource_integrated_minimal_core_v1\.py|planetary_resource_integrated_minimal_core_gate_v1\.py|test_planetary_resource_integrated_minimal_core_v1\.py|docs/planetary_resource_integrated_minimal_core_v1\.md|\.github/workflows/planetary-resource-integrated-minimal-core\.yml)$' || true)"
          test -z "$forbidden" || { echo "Forbidden frozen-core change:"; echo "$forbidden"; exit 1; }

      - name: Compile integration
        run: python -m compileall -q planetary_resource_integrated_minimal_core_v1.py planetary_resource_integrated_minimal_core_gate_v1.py test_planetary_resource_integrated_minimal_core_v1.py

      - name: Preserve legacy mathematical core
        run: python -m unittest -v test_equilibrium_planetary_resource_core_v1.py

      - name: Revalidate integration readiness freeze
        run: python -m unittest -v test_planetary_resource_integration_readiness_freeze_v1.py

      - name: Run integrated minimal core tests
        run: python -m unittest -v test_planetary_resource_integrated_minimal_core_v1.py

      - name: Build single integrated-state receipt
        shell: bash
        run: |
          python planetary_resource_integrated_minimal_core_gate_v1.py | tee integrated_minimal_core.log
          grep -F '"verdict":"PASS_BOUNDED_INTEGRATED_MINIMAL_PLANETARY_CORE"' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__INTEGRATED_MINIMAL_PLANETARY_CORE_RECEIPT.json
          grep -F '"full_evidence_lineage_preserved":true' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__INTEGRATED_MINIMAL_PLANETARY_CORE_RECEIPT.json
          grep -F '"process_version_guard_exercised":true' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__INTEGRATED_MINIMAL_PLANETARY_CORE_RECEIPT.json
          grep -F '"process_validity_guard_exercised":true' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__INTEGRATED_MINIMAL_PLANETARY_CORE_RECEIPT.json
          grep -F '"storage_topology_guard_exercised":true' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__INTEGRATED_MINIMAL_PLANETARY_CORE_RECEIPT.json

      - name: Preserve independent C++ baseline
        shell: bash
        run: |
          CXX="$(command -v g++-14 || command -v g++)"
          "$CXX" -std=c++23 -O2 -Wall -Wextra -Werror planetary_resource_cpp_kernel_v1.cpp -o planetary_resource_cpp_kernel_v1
          ./planetary_resource_cpp_kernel_v1 | tee cpp_baseline.log
          grep -Fx "CPP_MATRIX=40/40" cpp_baseline.log

      - name: Hash integrated evidence
        shell: bash
        run: |
          sha256sum EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__INTEGRATED_MINIMAL_PLANETARY_CORE.json planetary_resource_integrated_minimal_core_v1.py planetary_resource_integrated_minimal_core_gate_v1.py test_planetary_resource_integrated_minimal_core_v1.py EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__INTEGRATED_MINIMAL_PLANETARY_CORE_RECEIPT.json

      - name: Upload integrated evidence
        uses: actions/upload-artifact@v4
        with:
          name: planetary-resource-integrated-minimal-core-py${{ matrix.python-version }}
          path: |
            EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__INTEGRATED_MINIMAL_PLANETARY_CORE_RECEIPT.json
            integrated_minimal_core.log
            cpp_baseline.log
          if-no-files-found: error
