name: ESS Evidence Runtime CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional reference dependencies
        run: |
          if [ -f requirements-evidence-bound-authority.txt ]; then
            python -m pip install -r requirements-evidence-bound-authority.txt
          fi
      - name: Compile
        run: python -m compileall -q .
      - name: Core + negative + EQ64 + CLI/API tests
        run: python -m unittest -v
