name: Planetary Resource Typed Storage Self-Loss

on:
  push:
    branches:
      - "feature/planetary-resource-storage-self-loss-typed-rate-v1"
    paths:
      - EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__STORAGE_SELF_LOSS_TYPED_PHYSICAL_RATE.json
      - planetary_resource_storage_self_loss_typed_v1.py
      - planetary_resource_storage_self_loss_typed_gate_v1.py
      - test_planetary_resource_storage_self_loss_typed_v1.py
      - docs/planetary_resource_storage_self_loss_typed_v1.md
      - equilibrium_planetary_resource_core_v1.py
      - test_equilibrium_planetary_resource_core_v1.py
      - planetary_resource_cpp_kernel_v1.cpp
      - planetary_resource_process_typed_dimensional_closure_v1.py
      - planetary_resource_process_typed_dimensional_closure_gate_v1.py
      - test_planetary_resource_process_typed_dimensional_closure_v1.py
      - planetary_resource_end_to_end_uncertainty_v1.py
      - planetary_resource_end_to_end_uncertainty_gate_v1.py
      - test_planetary_resource_end_to_end_uncertainty_v1.py
      - planetary_resource_post_uncertainty_core_gap_review_v1.py
      - .github/workflows/planetary-resource-storage-self-loss-typed-rate.yml
  pull_request:
    paths:
      - EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__STORAGE_SELF_LOSS_TYPED_PHYSICAL_RATE.json
      - planetary_resource_storage_self_loss_typed_v1.py
      - planetary_resource_storage_self_loss_typed_gate_v1.py
      - test_planetary_resource_storage_self_loss_typed_v1.py
      - docs/planetary_resource_storage_self_loss_typed_v1.md
      - equilibrium_planetary_resource_core_v1.py
      - test_equilibrium_planetary_resource_core_v1.py
      - planetary_resource_cpp_kernel_v1.cpp
      - planetary_resource_process_typed_dimensional_closure_v1.py
      - planetary_resource_process_typed_dimensional_closure_gate_v1.py
      - test_planetary_resource_process_typed_dimensional_closure_v1.py
      - planetary_resource_end_to_end_uncertainty_v1.py
      - planetary_resource_end_to_end_uncertainty_gate_v1.py
      - test_planetary_resource_end_to_end_uncertainty_v1.py
      - planetary_resource_post_uncertainty_core_gap_review_v1.py
      - .github/workflows/planetary-resource-storage-self-loss-typed-rate.yml

permissions:
  contents: read

jobs:
  typed-storage-self-loss:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify pinned predecessor bytes
        shell: bash
        run: |
          echo "a2dafc38fac6c3077fc8972a0754bd216c4f8b4d83e4c2c8d33fca9b5f7c4aae  equilibrium_planetary_resource_core_v1.py" | sha256sum -c -
          echo "7e0ee2d2d5c24cd53d10ba04fcc49f752e26c5c050a3b65dc694f6b6cb20f26f  planetary_resource_cpp_kernel_v1.cpp" | sha256sum -c -
          echo "6590802c509f14e37f783a3e8243b756b8f2a3eb88fbb936772a6c039d2b69e2  planetary_resource_process_typed_dimensional_closure_v1.py" | sha256sum -c -
          echo "c62af9bc715ce4d088112c650f0c7794d9c2758a69088417135084740e2fb46c  planetary_resource_end_to_end_uncertainty_v1.py" | sha256sum -c -

      - name: Compile typed self-loss successor
        run: |
          python -m compileall -q             equilibrium_planetary_resource_core_v1.py             planetary_resource_process_typed_dimensional_closure_v1.py             planetary_resource_process_typed_dimensional_closure_gate_v1.py             planetary_resource_end_to_end_uncertainty_v1.py             planetary_resource_end_to_end_uncertainty_gate_v1.py             planetary_resource_post_uncertainty_core_gap_review_v1.py             planetary_resource_storage_self_loss_typed_v1.py             planetary_resource_storage_self_loss_typed_gate_v1.py             test_planetary_resource_storage_self_loss_typed_v1.py

      - name: Preserve legacy Python 40 of 40
        run: python -m unittest -v test_equilibrium_planetary_resource_core_v1.py

      - name: Preserve typed process closure
        run: python -m unittest -v test_planetary_resource_process_typed_dimensional_closure_v1.py

      - name: Preserve end-to-end uncertainty
        run: python -m unittest -v test_planetary_resource_end_to_end_uncertainty_v1.py

      - name: Preserve post-uncertainty review
        run: python -m unittest -v test_planetary_resource_post_uncertainty_core_gap_review_v1.py

      - name: Run typed storage self-loss tests
        run: python -m unittest -v test_planetary_resource_storage_self_loss_typed_v1.py

      - name: Build deterministic typed self-loss receipt
        shell: bash
        run: |
          python planetary_resource_storage_self_loss_typed_gate_v1.py | tee typed_storage_self_loss.log
          grep -F '"self_loss_uncertainty_included":true' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__STORAGE_SELF_LOSS_TYPED_PHYSICAL_RATE_RECEIPT.json
          grep -F '"moment_requires_covariance":true' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__STORAGE_SELF_LOSS_TYPED_PHYSICAL_RATE_RECEIPT.json
          grep -F '"empirical_requires_sample_alignment":true' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__STORAGE_SELF_LOSS_TYPED_PHYSICAL_RATE_RECEIPT.json
          grep -F '"verdict":"PASS_BOUNDED_STORAGE_SELF_LOSS_TYPED_PHYSICAL_RATE"' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__STORAGE_SELF_LOSS_TYPED_PHYSICAL_RATE_RECEIPT.json

      - name: Preserve independent C++ 40 of 40
        shell: bash
        run: |
          CXX="$(command -v g++-14 || command -v g++)"
          "$CXX" -std=c++23 -O2 -Wall -Wextra -Werror             planetary_resource_cpp_kernel_v1.cpp             -o planetary_resource_cpp_kernel_v1
          ./planetary_resource_cpp_kernel_v1 | tee cpp_baseline.log
          grep -Fx "CPP_MATRIX=40/40" cpp_baseline.log

      - name: Hash typed self-loss evidence
        shell: bash
        run: |
          sha256sum             EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__STORAGE_SELF_LOSS_TYPED_PHYSICAL_RATE.json             planetary_resource_storage_self_loss_typed_v1.py             planetary_resource_storage_self_loss_typed_gate_v1.py             test_planetary_resource_storage_self_loss_typed_v1.py             EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__STORAGE_SELF_LOSS_TYPED_PHYSICAL_RATE_RECEIPT.json

      - name: Upload typed self-loss evidence
        uses: actions/upload-artifact@v4
        with:
          name: planetary-resource-storage-self-loss-typed-py${{ matrix.python-version }}
          path: |
            EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__STORAGE_SELF_LOSS_TYPED_PHYSICAL_RATE_RECEIPT.json
            typed_storage_self_loss.log
            cpp_baseline.log
          if-no-files-found: error
