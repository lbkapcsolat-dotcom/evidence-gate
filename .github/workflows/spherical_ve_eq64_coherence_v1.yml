name: Spherical VE EQ64 coherence bind V1

on:
  push:
    branches:
      - feature/spherical-ve-eq64-coherence-bind-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spherical-ve-eq64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Materialize exact pinned HGraph runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --only-binary=:all: --no-deps "hgraph==0.8.31" -d wheelhouse
          wheel="$(find wheelhouse -maxdepth 1 -name 'hgraph-0.8.31-*.whl' -print -quit)"
          test -n "$wheel"
          echo "78b08521e11cfeb4b088e519e627f21b19171248ec36560a67779d344abe43b2  $wheel" | sha256sum -c -
          python -m pip install "$wheel"
          python -m pip install "nanobind==2.13.0"

      - name: Fresh runtime readback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.metadata, _hgraph
          assert importlib.metadata.version("hgraph") == "0.8.31"
          assert _hgraph.__file__
          print("HGRAPH_VERSION=0.8.31")
          print("NATIVE_HGRAPH_MODULE=" + _hgraph.__file__)
          PY

      - name: Compile gate
        run: |
          set -euo pipefail
          python -m compileall -q spherical_ve_eq64_hgraph_gate_v1.py

      - name: Execute HGraph bind, exact parity, replay and mutation controls
        run: |
          set -euo pipefail
          python spherical_ve_eq64_hgraph_gate_v1.py | tee spherical_ve_eq64_coherence.log
          grep -F '"verdict":"PASS_BOUNDED_SPHERICAL_VE_EQ64_HGRAPH_COHERENCE_10_OF_10__NO_GLOBAL_BIND"' SPHERICAL_VE_EQ64_COHERENCE_RECEIPT_V1.json

      - name: Hash evidence
        run: |
          set -euo pipefail
          sha256sum             spherical_ve_eq64_hgraph_gate_v1.py             SPHERICAL_VE_EQ64_REFERENCE_RECEIPT_V1.json             SPHERICAL_VE_EQ64_COHERENCE_RECEIPT_V1.json             spherical_ve_eq64_coherence.log             > SPHERICAL_VE_EQ64_SHA256SUMS.txt
          cat SPHERICAL_VE_EQ64_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: spherical-ve-eq64-coherence-bind-v1-evidence
          path: |
            SPHERICAL_VE_EQ64_REFERENCE_RECEIPT_V1.json
            SPHERICAL_VE_EQ64_COHERENCE_RECEIPT_V1.json
            SPHERICAL_VE_EQ64_SHA256SUMS.txt
            spherical_ve_eq64_coherence.log
          if-no-files-found: error
