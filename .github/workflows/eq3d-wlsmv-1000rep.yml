name: EQ3D Exact WLSMV 1000rep Grid V1

on:
  push:
    branches:
      - eq3d-wlsmv-1000rep-grid-v1
    paths:
      - ".github/workflows/eq3d-wlsmv-1000rep.yml"
      - "research/eq3d_wlsmv_1000rep/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grid:
    name: grid-N${{ matrix.n }}-${{ matrix.truth }}-s${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        n: [4800, 6000, 7200]
        truth: [M3, M4, M5, M7]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::lavaan
            any::mvtnorm

      - name: Run exact ordinal WLSMV shard
        env:
          GRID_N: ${{ matrix.n }}
          GRID_TRUTH: ${{ matrix.truth }}
          GRID_SHARD: ${{ matrix.shard }}
          GRID_REPS: 250
          GRID_OUT: result_${{ matrix.n }}_${{ matrix.truth }}_${{ matrix.shard }}.csv
        run: |
          Rscript research/eq3d_wlsmv_1000rep/grid_shard.R
          test "$(($(wc -l < "$GRID_OUT") - 1))" -eq 250
          sha256sum "$GRID_OUT" > "$GRID_OUT.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: grid-${{ matrix.n }}-${{ matrix.truth }}-${{ matrix.shard }}
          path: |
            result_${{ matrix.n }}_${{ matrix.truth }}_${{ matrix.shard }}.csv
            result_${{ matrix.n }}_${{ matrix.truth }}_${{ matrix.shard }}.csv.sha256
          if-no-files-found: error
          retention-days: 14

  sensitivity:
    name: exact-ESEM-method-factor-closure
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::lavaan
            any::mvtnorm
            any::jsonlite

      - name: Run exact sensitivity closure
        run: |
          Rscript research/eq3d_wlsmv_1000rep/sensitivity.R
          test -s sensitivity_receipt.json
          sha256sum sensitivity_receipt.json > sensitivity_receipt.json.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: sensitivity-closure
          path: |
            sensitivity_receipt.json
            sensitivity_receipt.json.sha256
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: aggregate-and-final-lock
    if: always()
    needs: [grid, sensitivity]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download grid artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: grid-*
          path: results
          merge-multiple: true

      - name: Download sensitivity artifact
        uses: actions/download-artifact@v4
        with:
          name: sensitivity-closure
          path: sensitivity

      - name: Aggregate exact receipts
        run: |
          python3 research/eq3d_wlsmv_1000rep/aggregate.py
          sha256sum FINAL_RECRUITMENT_LOCK_RECEIPT.json RESULT_MANIFEST.json CELL_SUMMARY.csv > FINAL_MANIFEST.sha256
          cat FINAL_RECRUITMENT_LOCK_RECEIPT.json

      - uses: actions/upload-artifact@v4
        with:
          name: eq3d-final-recruitment-lock-receipt
          path: |
            FINAL_RECRUITMENT_LOCK_RECEIPT.json
            RESULT_MANIFEST.json
            CELL_SUMMARY.csv
            FINAL_MANIFEST.sha256
          if-no-files-found: error
          retention-days: 30
