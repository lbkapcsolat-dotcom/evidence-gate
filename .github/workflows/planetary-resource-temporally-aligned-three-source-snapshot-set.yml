name: Planetary Resource Temporally Aligned Three-Source Snapshot Set

on:
  push:
    branches:
      - "feature/planetary-resource-temporally-aligned-three-source-snapshot-set-v1"
  pull_request:

permissions:
  contents: read

jobs:
  temporally-aligned-three-source-snapshot-set:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Enforce source-semantics successor-only changes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            target_sha="${{ github.event.pull_request.head.sha }}"
          else
            target_sha="$GITHUB_SHA"
          fi
          changed="$(git diff --name-only 72448cd06e4b9bd643ac8283b33b58563e3ab59e..$target_sha)"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -vE '^(EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__TEMPORALLY_ALIGNED_THREE_SOURCE_SNAPSHOT_SET\.json|planetary_resource_temporally_aligned_three_source_snapshot_set_v1\.py|test_planetary_resource_temporally_aligned_three_source_snapshot_set_v1\.py|docs/planetary_resource_temporally_aligned_three_source_snapshot_set_v1\.md|\.github/workflows/planetary-resource-temporally-aligned-three-source-snapshot-set\.yml)$' || true)"
          test -z "$forbidden" || { echo "Forbidden predecessor/core change:"; echo "$forbidden"; exit 1; }

      - name: Compile alignment preflight
        run: |
          python -m compileall -q \
            planetary_resource_temporally_aligned_three_source_snapshot_set_v1.py \
            test_planetary_resource_temporally_aligned_three_source_snapshot_set_v1.py

      - name: Preserve real three-layer composition HOLD predecessor
        run: python -m unittest -v test_planetary_resource_real_three_layer_input_composition_canary_v1.py

      - name: Run temporal alignment source-semantics preflight
        run: python -m unittest -v test_planetary_resource_temporally_aligned_three_source_snapshot_set_v1.py

      - name: Build deterministic source-semantics HOLD receipt
        shell: bash
        run: |
          python planetary_resource_temporally_aligned_three_source_snapshot_set_v1.py | tee temporally_aligned_three_source_snapshot_set.log
          grep -F '"verdict":"HOLD_SOURCE_INTERVAL_SEMANTICS_UNPROVEN"' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__TEMPORALLY_ALIGNED_THREE_SOURCE_SNAPSHOT_SET_RECEIPT.json
          grep -F '"new_source_records_ingested":0' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__TEMPORALLY_ALIGNED_THREE_SOURCE_SNAPSHOT_SET_RECEIPT.json
          grep -F '"new_source_ingest_performed":false' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__TEMPORALLY_ALIGNED_THREE_SOURCE_SNAPSHOT_SET_RECEIPT.json
          grep -F '"composition_performed":false' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__TEMPORALLY_ALIGNED_THREE_SOURCE_SNAPSHOT_SET_RECEIPT.json

      - name: Preserve legacy mathematical core
        run: python -m unittest -v test_equilibrium_planetary_resource_core_v1.py

      - name: Hash alignment-preflight evidence
        shell: bash
        run: |
          sha256sum \
            EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__TEMPORALLY_ALIGNED_THREE_SOURCE_SNAPSHOT_SET.json \
            planetary_resource_temporally_aligned_three_source_snapshot_set_v1.py \
            test_planetary_resource_temporally_aligned_three_source_snapshot_set_v1.py \
            EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__TEMPORALLY_ALIGNED_THREE_SOURCE_SNAPSHOT_SET_RECEIPT.json

      - name: Upload alignment-preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: planetary-resource-temporally-aligned-three-source-snapshot-set-py${{ matrix.python-version }}
          path: |
            EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__TEMPORALLY_ALIGNED_THREE_SOURCE_SNAPSHOT_SET_RECEIPT.json
            temporally_aligned_three_source_snapshot_set.log
          if-no-files-found: error
