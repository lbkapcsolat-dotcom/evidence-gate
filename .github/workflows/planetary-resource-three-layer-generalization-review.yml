name: Planetary Resource Three-Layer Generalization Review

on:
  push:
    branches:
      - "feature/planetary-resource-three-layer-generalization-review-v1"
    paths:
      - EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__THREE_LAYER_CANARY_GENERALIZATION_REVIEW.json
      - planetary_resource_three_layer_generalization_review_v1.py
      - test_planetary_resource_three_layer_generalization_review_v1.py
      - docs/planetary_resource_three_layer_generalization_review_v1.md
      - planetary_resource_first_real_source_canary_v1.py
      - planetary_resource_second_real_source_canary_v1.py
      - planetary_resource_third_real_source_gas_canary_v1.py
      - planetary_resource_empirical_admission_v1.py
      - equilibrium_planetary_resource_core_v1.py
      - planetary_resource_cpp_kernel_v1.cpp
      - .github/workflows/planetary-resource-three-layer-generalization-review.yml
  pull_request:
    paths:
      - EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__THREE_LAYER_CANARY_GENERALIZATION_REVIEW.json
      - planetary_resource_three_layer_generalization_review_v1.py
      - test_planetary_resource_three_layer_generalization_review_v1.py
      - docs/planetary_resource_three_layer_generalization_review_v1.md
      - planetary_resource_first_real_source_canary_v1.py
      - planetary_resource_second_real_source_canary_v1.py
      - planetary_resource_third_real_source_gas_canary_v1.py
      - planetary_resource_empirical_admission_v1.py
      - equilibrium_planetary_resource_core_v1.py
      - planetary_resource_cpp_kernel_v1.cpp
      - .github/workflows/planetary-resource-three-layer-generalization-review.yml

permissions:
  contents: read

jobs:
  generalization-review:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify all three frozen raw sources and empirical contract
        shell: bash
        run: |
          echo "c180db17bc02d371f1eebb4667695b715f0ce2f9c2f97bab6893b77f87c97c29  sources/environment_agency/1100TH_flow_mean_15min_2026-10-01T21-30Z.json" | sha256sum -c -
          echo "831ed964ef11527f0d8db767665289b59f5ef7b32fac02cd7667ad4b949a7242  sources/elexon/INDO_2026-10-01T22-00Z.json" | sha256sum -c -
          echo "a7f15400b518ec51ac0f6a97696bd7cd261e64730d1a348dc1a2ad0be0956928  sources/entsog/DE-TSO-0005_ITP-00188_entry_physical_flow_2026-10-01T21-22Z.html" | sha256sum -c -
          echo "592570140b8465cc4e9c38c84a9da5c1f6be73e9894bc1aad0a99e6ad023e9b3  EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__EMPIRICAL_DATA_CONTRACT.json" | sha256sum -c -
          echo "3fc420678148149cdfca9fae03088b2f54e5987bf29278d1e94497534a4151c2  planetary_resource_empirical_admission_v1.py" | sha256sum -c -

      - name: Compile review
        run: |
          python -m compileall -q             equilibrium_planetary_resource_core_v1.py             planetary_resource_empirical_admission_v1.py             planetary_resource_first_real_source_canary_v1.py             planetary_resource_second_real_source_canary_v1.py             planetary_resource_third_real_source_gas_canary_v1.py             planetary_resource_three_layer_generalization_review_v1.py             test_planetary_resource_three_layer_generalization_review_v1.py

      - name: Preserve mathematical core
        run: python -m unittest -v test_equilibrium_planetary_resource_core_v1.py

      - name: Preserve empirical admission contract
        run: python -m unittest -v test_planetary_resource_empirical_admission_v1.py

      - name: Preserve water canary
        run: python -m unittest -v test_planetary_resource_first_real_source_canary_v1.py

      - name: Preserve electricity canary
        run: python -m unittest -v test_planetary_resource_second_real_source_canary_v1.py

      - name: Preserve gas canary
        run: python -m unittest -v test_planetary_resource_third_real_source_gas_canary_v1.py

      - name: Run three-layer generalization review
        run: python -m unittest -v test_planetary_resource_three_layer_generalization_review_v1.py

      - name: Build deterministic review receipt
        shell: bash
        run: |
          python planetary_resource_three_layer_generalization_review_v1.py | tee three_layer_generalization_review.log
          grep -F '"adapter_generalization_requires_oil_canary":false' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__THREE_LAYER_CANARY_GENERALIZATION_REVIEW_RECEIPT.json
          grep -F '"four_layer_real_world_coverage_requires_oil_canary":true' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__THREE_LAYER_CANARY_GENERALIZATION_REVIEW_RECEIPT.json
          grep -F '"decision":"DEFER_UNTIL_CRUDE_OIL_ADMISSION_OR_FOUR_LAYER_COVERAGE_CLAIM"' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__THREE_LAYER_CANARY_GENERALIZATION_REVIEW_RECEIPT.json
          grep -F '"verdict":"PASS_BOUNDED_THREE_LAYER_ADAPTER_GENERALIZATION__CRUDE_OIL_DEFERRED_CONDITIONALLY"' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__THREE_LAYER_CANARY_GENERALIZATION_REVIEW_RECEIPT.json

      - name: Preserve independent C++ baseline
        shell: bash
        run: |
          CXX="$(command -v g++-14 || command -v g++)"
          "$CXX" -std=c++23 -O2 -Wall -Wextra -Werror             planetary_resource_cpp_kernel_v1.cpp             -o planetary_resource_cpp_kernel_v1
          ./planetary_resource_cpp_kernel_v1 | tee cpp_baseline.log
          grep -Fx "CPP_MATRIX=40/40" cpp_baseline.log

      - name: Hash review evidence
        shell: bash
        run: |
          sha256sum             EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__THREE_LAYER_CANARY_GENERALIZATION_REVIEW.json             planetary_resource_three_layer_generalization_review_v1.py             test_planetary_resource_three_layer_generalization_review_v1.py             EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__THREE_LAYER_CANARY_GENERALIZATION_REVIEW_RECEIPT.json

      - name: Upload review evidence
        uses: actions/upload-artifact@v4
        with:
          name: planetary-resource-three-layer-generalization-review-py${{ matrix.python-version }}
          path: |
            EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__THREE_LAYER_CANARY_GENERALIZATION_REVIEW_RECEIPT.json
            three_layer_generalization_review.log
            cpp_baseline.log
          if-no-files-found: error
