name: Planetary Resource Formal Temporal Support Operator Spec

on:
  push:
    branches:
      - "feature/planetary-resource-formal-temporal-support-operator-spec-v1"
  pull_request:

permissions:
  contents: read

jobs:
  formal-temporal-support-operator-spec:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Enforce successor-only changes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            target_sha="${{ github.event.pull_request.head.sha }}"
          else
            target_sha="$GITHUB_SHA"
          fi
          changed="$(git diff --name-only d288163e42aa8f752502bb4290c44600f399653f..$target_sha)"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -vE '^(EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__FORMAL_TEMPORAL_SUPPORT_OPERATOR_SPEC\.json|planetary_resource_formal_temporal_support_operator_spec_v1\.py|test_planetary_resource_formal_temporal_support_operator_spec_v1\.py|docs/planetary_resource_formal_temporal_support_operator_spec_v1\.md|\.github/workflows/planetary-resource-formal-temporal-support-operator-spec\.yml)$' || true)"
          test -z "$forbidden" || { echo "Forbidden predecessor/core change:"; echo "$forbidden"; exit 1; }

      - name: Compile formal spec
        run: |
          python -m compileall -q \
            planetary_resource_formal_temporal_support_operator_spec_v1.py \
            test_planetary_resource_formal_temporal_support_operator_spec_v1.py

      - name: Preserve temporal support policy freeze predecessor
        run: python -m unittest -v test_planetary_resource_temporal_support_policy_decision_freeze_v1.py

      - name: Run formal temporal support operator spec tests
        run: python -m unittest -v test_planetary_resource_formal_temporal_support_operator_spec_v1.py

      - name: Build deterministic formal spec receipt
        shell: bash
        run: |
          python planetary_resource_formal_temporal_support_operator_spec_v1.py | tee formal_temporal_support_operator_spec.log
          grep -F '"verdict":"PASS_BOUNDED_FORMAL_TEMPORAL_SUPPORT_OPERATOR_SPEC"' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__FORMAL_TEMPORAL_SUPPORT_OPERATOR_SPEC_RECEIPT.json
          grep -F '"path_b_activated":false' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__FORMAL_TEMPORAL_SUPPORT_OPERATOR_SPEC_RECEIPT.json
          grep -F '"operator_executed":false' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__FORMAL_TEMPORAL_SUPPORT_OPERATOR_SPEC_RECEIPT.json
          grep -F '"value_composition_performed":false' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__FORMAL_TEMPORAL_SUPPORT_OPERATOR_SPEC_RECEIPT.json

      - name: Preserve legacy mathematical core
        run: python -m unittest -v test_equilibrium_planetary_resource_core_v1.py

      - name: Hash formal spec evidence
        shell: bash
        run: |
          sha256sum \
            EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__FORMAL_TEMPORAL_SUPPORT_OPERATOR_SPEC.json \
            planetary_resource_formal_temporal_support_operator_spec_v1.py \
            test_planetary_resource_formal_temporal_support_operator_spec_v1.py \
            EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__FORMAL_TEMPORAL_SUPPORT_OPERATOR_SPEC_RECEIPT.json

      - name: Upload formal spec evidence
        uses: actions/upload-artifact@v4
        with:
          name: planetary-resource-formal-temporal-support-operator-spec-py${{ matrix.python-version }}
          path: |
            EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__FORMAL_TEMPORAL_SUPPORT_OPERATOR_SPEC_RECEIPT.json
            formal_temporal_support_operator_spec.log
          if-no-files-found: error
