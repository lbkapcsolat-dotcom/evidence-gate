name: Planetary Resource PATH B Three Provider Native Identity Canary

on:
  push:
    branches:
      - "feature/planetary-resource-path-b-three-provider-native-identity-canary-v1"
  pull_request:

permissions:
  contents: read

jobs:
  path-b-three-provider-native-identity-canary:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Enforce successor-only changes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            target_sha="${{ github.event.pull_request.head.sha }}"
          else
            target_sha="$GITHUB_SHA"
          fi
          changed="$(git diff --name-only 9d570e518ae0027357fe8fe4c554ca3f62a8b692..$target_sha)"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -vE '^(EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__PATH_B_THREE_PROVIDER_NATIVE_IDENTITY_CANARY\.json|planetary_resource_path_b_three_provider_native_identity_canary_v1\.py|test_planetary_resource_path_b_three_provider_native_identity_canary_v1\.py|docs/planetary_resource_path_b_three_provider_native_identity_canary_v1\.md|\.github/workflows/planetary-resource-path-b-three-provider-native-identity-canary\.yml)$' || true)"
          test -z "$forbidden" || { echo "Forbidden predecessor/core change:"; echo "$forbidden"; exit 1; }

      - name: Preserve Elexon identity predecessor
        run: python -m unittest -v test_planetary_resource_path_b_real_source_identity_activation_canary_v1.py

      - name: Run focused three-provider native identity canary test
        run: python -m unittest -v test_planetary_resource_path_b_three_provider_native_identity_canary_v1.py
