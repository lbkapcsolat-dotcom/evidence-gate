name: Planetary Resource EA Interval Semantics External Authority Resolution

on:
  push:
    branches:
      - "feature/planetary-resource-ea-interval-semantics-external-authority-resolution-v1"
  pull_request:

permissions:
  contents: read

jobs:
  ea-interval-semantics-external-authority-resolution:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Enforce successor-only changes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            target_sha="${{ github.event.pull_request.head.sha }}"
          else
            target_sha="$GITHUB_SHA"
          fi
          changed="$(git diff --name-only 36a4d855872ad106f4a84110a6bf8ce84b62130c..$target_sha)"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -vE '^(EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__ENVIRONMENT_AGENCY_INTERVAL_SEMANTICS_EXTERNAL_AUTHORITY_RESOLUTION\.json|planetary_resource_environment_agency_interval_semantics_external_authority_resolution_v1\.py|test_planetary_resource_environment_agency_interval_semantics_external_authority_resolution_v1\.py|docs/planetary_resource_environment_agency_interval_semantics_external_authority_resolution_v1\.md|\.github/workflows/planetary-resource-environment-agency-interval-semantics-external-authority-resolution\.yml)$' || true)"
          test -z "$forbidden" || { echo "Forbidden predecessor/core change:"; echo "$forbidden"; exit 1; }

      - name: Compile external-authority resolution
        run: |
          python -m compileall -q \
            planetary_resource_environment_agency_interval_semantics_external_authority_resolution_v1.py \
            test_planetary_resource_environment_agency_interval_semantics_external_authority_resolution_v1.py

      - name: Preserve EA source-surface predecessor
        run: python -m unittest -v test_planetary_resource_environment_agency_explicit_interval_source_surface_recovery_v1.py

      - name: Run external-authority resolution tests
        run: python -m unittest -v test_planetary_resource_environment_agency_interval_semantics_external_authority_resolution_v1.py

      - name: Build deterministic FINAL_HOLD receipt
        shell: bash
        run: |
          python planetary_resource_environment_agency_interval_semantics_external_authority_resolution_v1.py | tee ea_external_authority_resolution.log
          grep -F '"verdict":"FINAL_HOLD_FOR_EA_SOURCE_FAMILY__NO_AUTHORITATIVE_INTERVAL_BOUNDARY_RULE"' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__ENVIRONMENT_AGENCY_INTERVAL_SEMANTICS_EXTERNAL_AUTHORITY_RESOLUTION_RECEIPT.json
          grep -F '"authoritative_boundary_rule_obtained":false' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__ENVIRONMENT_AGENCY_INTERVAL_SEMANTICS_EXTERNAL_AUTHORITY_RESOLUTION_RECEIPT.json
          grep -F '"new_source_records_ingested":0' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__ENVIRONMENT_AGENCY_INTERVAL_SEMANTICS_EXTERNAL_AUTHORITY_RESOLUTION_RECEIPT.json
          grep -F '"source_family_status":"FINAL_HOLD"' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__ENVIRONMENT_AGENCY_INTERVAL_SEMANTICS_EXTERNAL_AUTHORITY_RESOLUTION_RECEIPT.json

      - name: Preserve legacy mathematical core
        run: python -m unittest -v test_equilibrium_planetary_resource_core_v1.py

      - name: Hash external-authority evidence
        shell: bash
        run: |
          sha256sum \
            EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__ENVIRONMENT_AGENCY_INTERVAL_SEMANTICS_EXTERNAL_AUTHORITY_RESOLUTION.json \
            planetary_resource_environment_agency_interval_semantics_external_authority_resolution_v1.py \
            test_planetary_resource_environment_agency_interval_semantics_external_authority_resolution_v1.py \
            EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__ENVIRONMENT_AGENCY_INTERVAL_SEMANTICS_EXTERNAL_AUTHORITY_RESOLUTION_RECEIPT.json

      - name: Upload external-authority evidence
        uses: actions/upload-artifact@v4
        with:
          name: planetary-resource-ea-external-authority-resolution-py${{ matrix.python-version }}
          path: |
            EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__ENVIRONMENT_AGENCY_INTERVAL_SEMANTICS_EXTERNAL_AUTHORITY_RESOLUTION_RECEIPT.json
            ea_external_authority_resolution.log
          if-no-files-found: error
