name: Historical vs Reconstructed Proof Equivalence

on:
  push:
    branches:
      - formal/historical-vs-reconstructed-equivalence-v1
    paths:
      - "reproof/**"
      - ".github/workflows/equilibrium-bridge-reconstructed-reproof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Pin historical and reconstructed source SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd reproof
          printf '%s  %s\n'             'e6bc11199bd5f0be517a6e62b603884deafce53de4761c2610059d5ee4179c6e' 'HistoricalBridgeBitVecPrimitiveProofs.lean'             '60b1909e5864de8bc8ea007711fd45b7e56f5af790659d2a3368853f0e2db6de' 'HistoricalRelativePairProofs.lean'             '20fa1e08e47912e12eb58c0f30cf4511f6a3241c3985c4884794300bbe67c9d9' 'ReconstructedBridge.lean'             'a65f5eb4255fe53f9ceb209ef5ebbc5eafcb464710039d175cb75858cb6d8f11' 'ReconstructedRelativeHomology.lean'             '58435f3e1e7f3cb1d725f5c4283be9158bb1c2001688e618a08365f1a9faab9c' 'ReproofHarness.lean'             '8733782dc070a99b312039cda424f601b80f3be6f6f512627da5ba25adc27632' 'lean-toolchain'             > /tmp/equivalence.sha256
          sha256sum -c /tmp/equivalence.sha256

      - name: Python reconstructed frozen observables
        shell: bash
        run: |
          set -euo pipefail
          cd reproof
          python -m unittest -v test_reconstructed_model.py

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned mathlib and cache
        shell: bash
        run: |
          set -euo pipefail
          cd reproof
          lake update
          lake exe cache get

      - name: Fresh pinned Lean 4.34.0 equivalence build
        shell: bash
        run: |
          set -euo pipefail
          cd reproof
          lean --version
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.34.0"
          lake build EquilibriumReproof

      - name: Zero sorry admit axiom
        shell: bash
        run: |
          set -euo pipefail
          if grep -n -E '\b(sorry|admit|axiom)\b'             reproof/HistoricalBridgeBitVecPrimitiveProofs.lean             reproof/HistoricalRelativePairProofs.lean             reproof/ReconstructedBridge.lean             reproof/ReconstructedRelativeHomology.lean             reproof/ReproofHarness.lean             reproof/HistoricalVsReconstructedEquivalence.lean             reproof/lakefile.lean; then
            echo "forbidden proof escape token found"
            exit 1
          fi

      - name: Preserve exact 6 of 192 negative regression
        shell: bash
        run: |
          set -euo pipefail
          cd reproof
          python - <<'PY'
          from reconstructed_model import metrics
          expected = [
              (31,63,15,63,2),
              (47,63,27,63,2),
              (55,63,29,63,2),
              (59,63,23,63,2),
              (61,63,30,63,2),
              (62,63,30,63,2),
          ]
          observed = metrics()
          assert observed["cubical_edges"] == 192
          assert observed["cubical_diagonal_counterexamples"] == expected
          print("PASS_EXACT_6_OF_192_NEGATIVE_REGRESSION")
          PY

      - name: Final source SHA256 readback
        shell: bash
        run: |
          set -euo pipefail
          sha256sum             reproof/HistoricalBridgeBitVecPrimitiveProofs.lean             reproof/HistoricalRelativePairProofs.lean             reproof/ReconstructedBridge.lean             reproof/ReconstructedRelativeHomology.lean             reproof/ReproofHarness.lean             reproof/HistoricalVsReconstructedEquivalence.lean             reproof/lakefile.lean             reproof/lean-toolchain
