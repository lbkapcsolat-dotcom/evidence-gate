name: Equilibrium Bridge Reconstructed Reproof

on:
  push:
    branches:
      - formal/equilibrium-bridge-reconstructed-reproof-v1
    paths:
      - "reproof/**"
      - ".github/workflows/equilibrium-bridge-reconstructed-reproof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python reconstructed reference
        shell: bash
        run: |
          set -euo pipefail
          cd reproof
          python -m unittest -v test_reconstructed_model.py

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned mathlib and cache
        shell: bash
        run: |
          set -euo pipefail
          cd reproof
          lake update
          lake exe cache get

      - name: Lean reconstructed proofs
        shell: bash
        run: |
          set -euo pipefail
          cd reproof
          lean --version
          lake build EquilibriumReproof

      - name: Proof escape scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '\b(sorry|admit|axiom)\b' reproof --include='*.lean'; then
            echo "forbidden proof escape token found"
            exit 1
          fi

      - name: Historical SHA impersonation guard
        shell: bash
        run: |
          set -euo pipefail
          observed=$(sha256sum reproof/ReconstructedBridge.lean reproof/ReconstructedRelativeHomology.lean)
          echo "$observed"
          ! echo "$observed" | grep -qi 'e6bc11199bd5f0be517a6e62b603884deafce53de4761c2610059d5ee4179c6e'
          ! echo "$observed" | grep -qi '60b1909e5864de8bc8ea007711fd45b7e56f5af790659d2a3368853f0e2db6de'

      - name: Source SHA256
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            reproof/reconstructed_model.py \
            reproof/test_reconstructed_model.py \
            reproof/ReconstructedBridge.lean \
            reproof/ReconstructedRelativeHomology.lean \
            reproof/ReproofHarness.lean \
            reproof/lakefile.lean \
            reproof/lean-toolchain
