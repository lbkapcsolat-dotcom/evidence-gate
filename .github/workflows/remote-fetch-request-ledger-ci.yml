name: Remote Fetch Request Ledger CI

on:
  push:
    branches:
      - formal/remote-fetch-request-ledger-v1
  pull_request:
    paths:
      - remote_fetch_request_ledger.py
      - test_remote_fetch_request_ledger.py
      - .github/workflows/remote-fetch-request-ledger-ci.yml

jobs:
  ledger-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run branch-local remote fetch ledger gate
        run: python -m unittest -v test_remote_fetch_request_ledger.py
