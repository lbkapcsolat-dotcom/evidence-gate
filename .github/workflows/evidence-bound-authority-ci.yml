name: Evidence Bound Authority CI

on:
  push:
    branches:
      - feature/evidence-bound-single-use-auth-v5
    paths:
      - evidence_bound_authority.py
      - test_evidence_bound_authority.py
      - requirements-evidence-bound-authority.txt
      - .github/workflows/evidence-bound-authority-ci.yml
  pull_request:
    paths:
      - evidence_bound_authority.py
      - test_evidence_bound_authority.py
      - requirements-evidence-bound-authority.txt
      - .github/workflows/evidence-bound-authority-ci.yml

permissions:
  contents: read

jobs:
  reference-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated reference dependency
        run: python -m pip install -r requirements-evidence-bound-authority.txt
      - name: Compile reference module
        run: python -m compileall -q evidence_bound_authority.py test_evidence_bound_authority.py
      - name: V5 contract + V6 durability fixtures
        run: python -m unittest -v test_evidence_bound_authority.py
