name: Evidence Bound Authority CI

on:
  push:
    branches:
      - "feature/evidence-bound-*"
    paths:
      - evidence_bound_authority.py
      - evidence_bound_hardening.py
      - evidence_bound_hardening_worker.py
      - test_evidence_bound_authority.py
      - test_evidence_bound_hardening.py
      - requirements-evidence-bound-authority.txt
      - .github/workflows/evidence-bound-authority-ci.yml
  pull_request:
    paths:
      - evidence_bound_authority.py
      - evidence_bound_hardening.py
      - evidence_bound_hardening_worker.py
      - test_evidence_bound_authority.py
      - test_evidence_bound_hardening.py
      - requirements-evidence-bound-authority.txt
      - .github/workflows/evidence-bound-authority-ci.yml

permissions:
  contents: read

jobs:
  reference-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated reference dependency
        run: python -m pip install -r requirements-evidence-bound-authority.txt
      - name: Compile reference modules
        run: python -m compileall -q evidence_bound_authority.py evidence_bound_hardening.py evidence_bound_hardening_worker.py test_evidence_bound_authority.py test_evidence_bound_hardening.py
      - name: V5 authority + V6-V8 hardening fixtures
        run: python -m unittest -v test_evidence_bound_authority.py test_evidence_bound_hardening.py
