name: Planetary Resource Source Interval Semantics Recovery

on:
  push:
    branches:
      - "feature/planetary-resource-source-interval-semantics-recovery-v1"
  pull_request:

permissions:
  contents: read

jobs:
  source-interval-semantics-recovery:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Enforce semantics-recovery successor-only changes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            target_sha="${{ github.event.pull_request.head.sha }}"
          else
            target_sha="$GITHUB_SHA"
          fi
          changed="$(git diff --name-only 0b5e5012f24f7bec7fa07ab69bfd5b8c3b1bc43d..$target_sha)"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -vE '^(EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__SOURCE_INTERVAL_SEMANTICS_RECOVERY\.json|planetary_resource_source_interval_semantics_recovery_v1\.py|test_planetary_resource_source_interval_semantics_recovery_v1\.py|docs/planetary_resource_source_interval_semantics_recovery_v1\.md|\.github/workflows/planetary-resource-source-interval-semantics-recovery\.yml)$' || true)"
          test -z "$forbidden" || { echo "Forbidden predecessor/core change:"; echo "$forbidden"; exit 1; }

      - name: Compile recovery
        run: |
          python -m compileall -q \
            planetary_resource_source_interval_semantics_recovery_v1.py \
            test_planetary_resource_source_interval_semantics_recovery_v1.py

      - name: Preserve temporal-alignment HOLD predecessor
        run: python -m unittest -v test_planetary_resource_temporally_aligned_three_source_snapshot_set_v1.py

      - name: Run source interval semantics recovery tests
        run: python -m unittest -v test_planetary_resource_source_interval_semantics_recovery_v1.py

      - name: Build deterministic partial-recovery HOLD receipt
        shell: bash
        run: |
          python planetary_resource_source_interval_semantics_recovery_v1.py | tee source_interval_semantics_recovery.log
          grep -F '"verdict":"HOLD_SOURCE_INTERVAL_SEMANTICS_RECOVERY_PARTIAL__ELEXON_PROVEN__EA_UNPROVEN"' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__SOURCE_INTERVAL_SEMANTICS_RECOVERY_RECEIPT.json
          grep -F '"elexon_recovered":true' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__SOURCE_INTERVAL_SEMANTICS_RECOVERY_RECEIPT.json
          grep -F '"environment_agency_recovered":false' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__SOURCE_INTERVAL_SEMANTICS_RECOVERY_RECEIPT.json
          grep -F '"new_source_records_ingested":0' EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__SOURCE_INTERVAL_SEMANTICS_RECOVERY_RECEIPT.json

      - name: Preserve legacy mathematical core
        run: python -m unittest -v test_equilibrium_planetary_resource_core_v1.py

      - name: Hash recovery evidence
        shell: bash
        run: |
          sha256sum \
            EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__SOURCE_INTERVAL_SEMANTICS_RECOVERY.json \
            planetary_resource_source_interval_semantics_recovery_v1.py \
            test_planetary_resource_source_interval_semantics_recovery_v1.py \
            EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__SOURCE_INTERVAL_SEMANTICS_RECOVERY_RECEIPT.json

      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: planetary-resource-source-interval-semantics-recovery-py${{ matrix.python-version }}
          path: |
            EQUILIBRIUM_PLANETARY_RESOURCE_SYSTEMS_CORE_V1__SOURCE_INTERVAL_SEMANTICS_RECOVERY_RECEIPT.json
            source_interval_semantics_recovery.log
          if-no-files-found: error
